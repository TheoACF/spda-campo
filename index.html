<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPDA Campo — Inspeção, Progresso e Laudo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#1c2421">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout estilo prancha técnica EPLAN — faixa de progresso, abas operacionais, linhas tipo carimbo */
:root{
  --bg:#f5f6f4;--panel:#ffffff;--fg:#1c2421;--muted:#5f6b66;--line:#d6dbd8;
  --accent:#c98a00;--ok:#2f7d4f;--warn:#b5561c;--nc:#d13b3b;--info:#2b5f8a;--chip:#eef0ee;
  --wa:#1fa855;--drv:#1a73e8;--pink:#d66094;
  --f-disp:"Barlow Condensed",Impact,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131816;--panel:#1b2220;--fg:#e4e9e6;--muted:#97a39e;--line:#2d3633;
    --accent:#f0b429;--ok:#5cc28a;--warn:#f08a4b;--nc:#f26464;--info:#6fa8d6;--chip:#232b29;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
}
.wrap{
  max-width:1080px;margin:0 auto;padding-block:14px 40px;
  padding-left:max(12px,env(safe-area-inset-left,0px));
  padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;
}
header.top-stamp{
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;
  border-bottom:3px solid var(--fg);padding-bottom:10px;
}
h1{font:700 1.95rem/1 var(--f-disp);letter-spacing:.02em;margin:0;text-transform:uppercase}
.sub{color:var(--muted);font-size:.86rem;margin-top:4px}
.meta{font:500 .76rem/1.45 var(--f-mono);color:var(--muted);text-align:right}
.prog{display:flex;flex-direction:column;gap:5px;background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.bar{height:10px;background:var(--chip);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.bar i.ok-bar{background:var(--ok)}
.prog .lbl{display:flex;justify-content:space-between;font:500 .8rem var(--f-mono);color:var(--muted)}
.prog .lbl b{color:var(--fg)}
.next{
  background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);
  padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;
}
.next:active{opacity:.85}
.next .k{font:600 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.next .v{font-weight:600;margin-top:2px;font-size:.94rem}
nav.tabs{display:flex;flex-wrap:wrap;gap:5px}
nav.tabs button{
  font:600 .83rem var(--f-body);background:var(--chip);color:var(--fg);
  border:1px solid var(--line);padding:8px 11px;cursor:pointer;flex:1 1 auto;text-align:center;
}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
section.box{background:var(--panel);border:1px solid var(--line)}
section.box h2{
  font:700 1.15rem var(--f-disp);text-transform:uppercase;letter-spacing:.03em;
  margin:0;padding:10px 14px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:8px;
}
.filt{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.filt button{
  font:600 .74rem var(--f-mono);background:none;color:var(--muted);
  border:1px solid var(--line);padding:5px 9px;cursor:pointer;
}
.filt button[aria-pressed="true"]{color:var(--bg);background:var(--fg);border-color:var(--fg)}
.scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
table.tbl th,table.tbl td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl th{
  font:600 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);background:var(--chip);white-space:nowrap;
}
td.n{font:600 .84rem var(--f-mono);white-space:nowrap}
code,.mono{font-family:var(--f-mono);font-size:.8rem}
tr.done td:not(.c):not(.no-strike){opacity:.58}
td.c{width:34px;text-align:center}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok);cursor:pointer}
.tag{
  display:inline-block;font:600 .68rem var(--f-mono);padding:2px 6px;
  border:1px solid currentColor;white-space:nowrap;text-transform:uppercase;
}
.tag.CONCLUIDO{color:var(--ok)}
.tag.ANDAMENTO{color:var(--info)}
.tag.NC{color:var(--nc)}
.tag.PENDENTE{color:var(--muted)}
.note{padding:10px 14px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
h3{margin:2px 0 10px;font:700 1rem var(--f-disp);color:var(--fg);text-transform:uppercase;letter-spacing:.04em}
button.b,.seg button{
  border:1px solid var(--line);background:var(--chip);color:var(--fg);
  padding:8px 11px;font:600 .82rem var(--f-body);cursor:pointer;
}
button.b:active,.seg button:active{transform:scale(.98)}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg button.on.bad{background:var(--nc);color:#fff;border-color:var(--nc)}
.seg button.on.good{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg button.on.pink{background:var(--pink);color:#fff;border-color:var(--pink)}
input:not([type=checkbox]),select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);font:15px var(--f-body);
}
label{font:600 .73rem var(--f-mono);color:var(--muted);display:block;margin:6px 0 3px;text-transform:uppercase}
.d{border-left:5px solid var(--line)}
.d.ok{border-left-color:var(--ok)}
.d.nc{border-left-color:var(--nc)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
small{color:var(--muted);font-size:12px}
.big{
  width:100%;padding:12px 14px;font:700 .95rem var(--f-disp);letter-spacing:.03em;text-transform:uppercase;
  border:1px solid var(--fg);background:var(--fg);color:var(--bg);margin:4px 0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
}
.big.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.big.drv{background:var(--drv);border-color:var(--drv);color:#fff}
.big.out{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.th{
  position:relative;width:82px;height:82px;overflow:hidden;
  border:1px solid var(--line);background:#000;flex-shrink:0;
}
.th img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.th button{
  position:absolute;top:2px;right:2px;width:22px;height:22px;
  border:0;background:rgba(209,59,59,.92);color:#fff;font-size:12px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
}
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:14px;
}
.modal{
  background:var(--panel);color:var(--fg);max-width:520px;width:100%;
  max-height:92vh;overflow-y:auto;padding:16px;border:2px solid var(--fg);
}
.inline-edit{
  border:1px dashed var(--line);padding:4px 8px;font:600 .9rem var(--f-mono);
  width:auto;min-width:85px;max-width:170px;background:transparent;
}
.chk-pill{
  display:inline-flex;align-items:center;gap:3px;font:500 .72rem var(--f-mono);
  padding:2px 5px;border:1px solid var(--line);background:var(--chip);cursor:pointer;margin-right:3px;
}
.chk-pill.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.foot{font:.76rem var(--f-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
/* Print / PDF A4 */
#print-area{display:none}
@media print{
  .wrap,.modal-bg{display:none!important}
  body{background:#fff!important;color:#000!important;padding:0!important;font-size:12px}
  #print-area{display:block!important;padding:10mm}
  .p-card{border:1px solid #bbb;padding:8px;margin-bottom:10px;page-break-inside:avoid}
  .p-tbl{width:100%;border-collapse:collapse;margin:6px 0;font-size:11px}
  .p-tbl th,.p-tbl td{border:1px solid #999;padding:4px 6px;text-align:left}
  .p-tbl th{background:#eee}
  .p-grid-ph{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
  .p-ph{border:1px solid #ccc;padding:4px;text-align:center;page-break-inside:avoid}
  .p-ph img{max-width:100%;height:190px;object-fit:contain}
}
</style>
</head>
<body>
<div class="wrap" id="app-wrap"></div>
<div id="modal-root"></div>
<div id="print-area"></div>

<script>
const DRIVE_FOLDERS = {
  1: {
    label: "Equipe A (Dupla 1)",
    short: "EquipeA",
    id: "1Yb-zWeo4lCsbByDpDlL0YMxbF3GlqHqA",
    url: "https://drive.google.com/drive/folders/1Yb-zWeo4lCsbByDpDlL0YMxbF3GlqHqA?usp=drive_link"
  },
  2: {
    label: "Equipe B (Dupla 2)",
    short: "EquipeB",
    id: "1HgzIPxKpqCl9-1c6H2LZIW46egbPU75r",
    url: "https://drive.google.com/drive/folders/1HgzIPxKpqCl9-1c6H2LZIW46egbPU75r?usp=drive_link"
  }
};

const DEFAULT_B = [
  ["A","Bloco A",1,""],
  ["B","Bloco B",1,""],
  ["D","Bloco D",1,""],
  ["E","Bloco E",2,""],
  ["G","Bloco G",2,""],
  ["H","Bloco H",2,""],
  ["I","Bloco I",1,""],
  ["J","Bloco J",1,""],
  ["K","Bloco K",2,""],
  ["L","Bloco L",2,""],
  ["N","Bloco N (+BEP)",2,"bep"],
  ["Q","Quadra Coberta (+BEP)",1,"bep"],
  ["Bi","Biblioteca",2,""],
  ["P","Portaria (+BEP Principal)",1,"bep dps"],
  ["R","BEP Reservatório",1,"only"]
];

const COD = {
  C1:["Continuidade alta ou aberta","A"],
  C2:["Falta conector bimetálico","B"],
  C3:["Conector frouxo/oxidado","B"],
  C4:["Caixa de inspeção sem tampa/quebrada","B"],
  C5:["Falta placa Risco de Choque","C"],
  C6:["Falta eletroduto PVC 1\"","C"],
  C7:["Barra de Al amassada/solta","B"],
  C8:["Cordoalha solta/suporte quebrado","A"],
  C9:["Sem equipotencialização","B"],
  C10:["Aterramento acima do limite/sem haste","A"],
  C11:["Outro","C"]
};

const CHK = [
  ["cap","Captação (cordoalha Cu 50 mm² e suportes) íntegra?"],
  ["top","Conexão de topo Cu/Al firme, sem corrosão?"],
  ["desc","Descidas retas e fixadas a cada 1 m?"],
  ["prot","Eletroduto PVC e placa no pé da descida?"],
  ["mass","Massas metálicas aterradas?"]
];

const LIB_CHK = [
  "Todos os blocos da Equipe A (Dupla 1) inspecionados e medidos",
  "Todos os blocos da Equipe B (Dupla 2) inspecionados e medidos",
  "Continuidade elétrica das descidas conferida (critério ≤ 0,2 Ω — NBR 5419-3)",
  "Resistência de aterramento medida nas caixas/BEP (critério ≤ 10 Ω)",
  "BEPs (Bloco N, Quadra, Portaria e Reservatório) verificados e fotografados",
  "DPS do QDG da Portaria verificado",
  "Todas as fotos em HD com carimbo (Local -- Ponto + Data/Hora) conferidas",
  "Pontos conformes (Rosa) e não conformes (Vermelho) pintados na planta A3",
  "Não conformidades (NC) críticas classificadas com severidade A/B/C",
  "Pacote (Laudo PDF + JSON + Fotos HD) enviado para o Google Drive das Equipes A e B"
];

let S = {
  cfg: {
    cliente: "Amigos do Bem",
    local: "Inajá - PE",
    proposta: "NBR 5419:2015",
    data: new Date().toISOString().slice(0,10),
    equipeAtiva: 1,
    driveA: DRIVE_FOLDERS[1].url,
    driveB: DRIVE_FOLDERS[2].url,
    resFoto: 2560, // HD / 4K com carimbo
    carimboOn: 1,
    resp: "",
    crea: "",
    limC: 0.2,
    limT: 10,
    url: "",
    tok: "",
    eq: "",
    ap: ""
  },
  blocos: null,
  lib: {},
  f: {}
};

let db, view = "", activeTab = "blocos", searchQ = "", filterMode = "ALL", filterDupla = 0, photoURLCache = {};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function teamLabel(d) {
  return d == 2 ? "Equipe B (Dupla 2)" : "Equipe A (Dupla 1)";
}

function getDriveUrl(teamNum) {
  if (teamNum == 2) return S.cfg.driveB || DRIVE_FOLDERS[2].url;
  return S.cfg.driveA || DRIVE_FOLDERS[1].url;
}

function getDriveFolderId(teamNum) {
  const u = getDriveUrl(teamNum);
  const m = String(u).match(/folders\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  return teamNum == 2 ? DRIVE_FOLDERS[2].id : DRIVE_FOLDERS[1].id;
}

function getB() {
  if (!Array.isArray(S.blocos) || !S.blocos.length) {
    S.blocos = DEFAULT_B.map(x => [...x]);
  }
  return S.blocos;
}

function idb() {
  return new Promise(r => {
    const q = indexedDB.open("spda", 1);
    q.onupgradeneeded = () => {
      if (!q.result.objectStoreNames.contains("kv")) q.result.createObjectStore("kv");
      if (!q.result.objectStoreNames.contains("ph")) q.result.createObjectStore("ph");
    };
    q.onsuccess = () => r(q.result);
  });
}

const tx = (st, m, f) => new Promise(r => {
  const t = db.transaction(st, m), o = f(t.objectStore(st));
  t.oncomplete = () => r(o && o.result);
});
const kget = k => tx("kv", "readonly", s => s.get(k));
const kset = (k, v) => tx("kv", "readwrite", s => s.put(v, k));
const pall = () => tx("ph", "readonly", s => s.getAll());
const pkeys = () => tx("ph", "readonly", s => s.getAllKeys());
const pset = (k, v) => tx("ph", "readwrite", s => s.put(v, k));
const pget = k => tx("ph", "readonly", s => s.get(k));
const pdel = k => tx("ph", "readwrite", s => s.delete(k));

let tm;
function save() {
  clearTimeout(tm);
  tm = setTimeout(() => kset("S", S), 160);
}

const R = i => ({
  p: "D" + String(i + 1).padStart(2, "0"),
  loc: "",
  barra: "",
  eld: "",
  cx: "",
  cont: "",
  terra: "",
  ph: [],
  pl: "",
  obs: ""
});

function F(id) {
  const b = getB().find(x => x[0] == id) || [id, id, 1, ""];
  return S.f[id] ??= (() => {
    const o = b[3] || "";
    return {
      id,
      hi: "",
      hf: "",
      solo: "",
      obs: "",
      dupla: b[2],
      chk: {},
      bepOk: "",
      bepC: "",
      bepT: "",
      bepPh: [],
      dps: "",
      rows: o.includes("only") ? [] : Array.from({length: 8}, (_, i) => R(i)),
      ncs: [],
      done: {vis: 0, med: 0, foto: 0, pl: 0}
    };
  })();
}

const num = v => parseFloat(String(v ?? "").replace(",", "."));

function judge(r) {
  const c = num(r.cont), t = num(r.terra), bad = [];
  if (!isNaN(c) && c > S.cfg.limC) bad.push("Cont. " + c + " Ω > " + S.cfg.limC);
  if (!isNaN(t) && t > S.cfg.limT) bad.push("Terra " + t + " Ω > " + S.cfg.limT);
  return bad;
}

function blockStats(b) {
  const f = F(b[0]);
  const o = b[3] || "";
  const isOnly = o.includes("only");
  const totR = f.rows.length;
  const medR = f.rows.filter(r => r.cont !== "" || r.terra !== "").length;
  const ncsRows = f.rows.filter(r => judge(r).length || [r.barra, r.eld, r.cx].includes("NC")).length;
  const totNC = f.ncs.length + ncsRows;
  const totPh = (f.bepPh || []).length + f.rows.reduce((a, r) => a + (r.ph || []).length, 0) + f.ncs.reduce((a, n) => a + (n.ph || []).length, 0);
  const chkCount = Object.values(f.chk || {}).filter(Boolean).length;

  const isCompleted = !!(f.done && f.done.vis && f.done.med && f.done.foto && f.done.pl) ||
    (isOnly ? (f.bepOk && (f.bepC || f.bepT) && totPh > 0) : (totR > 0 && medR === totR && chkCount >= 3 && totPh > 0));
  const isStarted = !!(medR > 0 || chkCount > 0 || totPh > 0 || f.bepOk || f.bepC || f.bepT || f.hi || f.done.vis || f.done.med);

  let status = "PENDENTE";
  if (totNC > 0 && !f.done.pl) status = "NC";
  else if (isCompleted) status = "CONCLUIDO";
  else if (isStarted) status = "ANDAMENTO";

  const missing = [];
  if (!isOnly && chkCount < CHK.length && !f.done.vis) missing.push(`Checklist (${chkCount}/${CHK.length})`);
  if (!isOnly && medR < totR && !f.done.med) missing.push(`Medições (${medR}/${totR})`);
  if ((o.includes("bep") || isOnly) && !f.bepC && !f.bepT) missing.push("Medir BEP");
  if (totPh === 0 && !f.done.foto) missing.push("Fotos HD");
  if (!f.done.pl) missing.push("Planta A3");

  return {f, totR, medR, totNC, totPh, chkCount, isCompleted, isStarted, status, missing};
}

function go(v, tab) {
  view = v;
  if (tab) activeTab = tab;
  render();
  scrollTo(0, 0);
}

function set(id, path, v, rr) {
  let o = F(id), k = path.split(".");
  while (k.length > 1) o = o[k.shift()];
  o[k[0]] = v;
  save();
  if (rr) render();
}

function toggleDone(id, key) {
  const f = F(id);
  f.done[key] = f.done[key] ? 0 : 1;
  save();
  render();
}

function toggleBlockAllDone(id, checked) {
  const f = F(id);
  const v = checked ? 1 : 0;
  f.done = {vis: v, med: v, foto: v, pl: v};
  save();
  render();
}

function toggleLib(idx, checked) {
  S.lib ??= {};
  S.lib["k" + idx] = checked ? 1 : 0;
  save();
  render();
}

const seg = (id, path, cur, opts) =>
  `<span class="seg">${opts.map(([v, l, c]) =>
    `<button type="button" class="${cur === v ? "on " + (c || "") : ""}" onclick="set('${esc(id)}','${path}','${cur === v ? "" : v}',1)">${l}</button>`
  ).join("")}</span>`;

async function getThumbURL(name) {
  if (photoURLCache[name]) return photoURLCache[name];
  const rec = await pget(name);
  if (rec && rec.b) {
    const u = URL.createObjectURL(rec.b);
    photoURLCache[name] = u;
    return u;
  }
  return "";
}

async function hydrateThumbs() {
  const imgs = document.querySelectorAll("img[data-ph]");
  for (const img of imgs) {
    const k = img.getAttribute("data-ph");
    const u = await getThumbURL(k);
    if (u) img.src = u;
  }
}

function renderThumbs(id, list, kind, idx) {
  if (!list || !list.length) return "";
  return `<div class="thumbs">${list.map((name, pi) => `
    <div class="th">
      <img data-ph="${esc(name)}" alt="Foto HD" onclick="viewPhoto('${esc(name)}')">
      <button type="button" title="Excluir foto" onclick="delPhoto('${esc(id)}','${kind}',${idx},${pi},'${esc(name)}')">✕</button>
    </div>
  `).join("")}</div>`;
}

async function viewPhoto(name) {
  const rec = await pget(name);
  if (!rec || !rec.b) return;
  const u = await getThumbURL(name);
  $("#modal-root").innerHTML = `
    <div class="modal-bg" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()" style="text-align:center">
        <div class="row" style="margin-bottom:8px">

/* ============================================================================
   CAPTURA DE FOTO EM HD / RESOLUÇÃO MÁXIMA + CARIMBO (MODELO DA IMAGEM ANEXA)
   Exemplo na foto:
   [ edifício A--Bepe          ]
   [ 15 de nov. de 2026 14:45:38 ]
   ============================================================================ */
function formatStampDate(d) {
  const meses = ["jan.", "fev.", "mar.", "abr.", "mai.", "jun.", "jul.", "ago.", "set.", "out.", "nov.", "dez."];
  const dia = d.getDate();
  const mes = meses[d.getMonth()];
  const ano = d.getFullYear();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const ss = String(d.getSeconds()).padStart(2, "0");
  return `${dia} de ${mes} de ${ano} ${hh}:${mm}:${ss}`;
}

function roundRectCanvas(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function processPhotoHDWithStamp(file, stampLine1, stampLine2) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const maxDim = Number(S.cfg.resFoto) || 2560; // HD / 4K nativo
      const scale = maxDim > 0 ? Math.min(1, maxDim / Math.max(img.width, img.height)) : 1;
      const W = Math.round(img.width * scale);
      const H = Math.round(img.height * scale);

      const c = document.createElement("canvas");
      c.width = W;
      c.height = H;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, W, H);

      // Desenha o carimbo idêntico à referência no canto superior esquerdo
      if (S.cfg.carimboOn !== 0) {
        const refSide = Math.min(W, H);
        const marginX = Math.round(refSide * 0.038);
        const marginY = Math.round(refSide * 0.038);
        const fontTitle = Math.max(18, Math.round(refSide * 0.036));
        const fontSub = Math.max(15, Math.round(refSide * 0.030));
        const padX = Math.round(fontTitle * 0.75);
        const padY = Math.round(fontTitle * 0.65);
        const lineGap = Math.round(fontTitle * 0.35);

        ctx.font = `700 ${fontTitle}px system-ui, -apple-system, Roboto, Arial, sans-serif`;
        const w1 = ctx.measureText(stampLine1).width;
        ctx.font = `400 ${fontSub}px system-ui, -apple-system, Roboto, Arial, sans-serif`;
        const w2 = ctx.measureText(stampLine2).width;

        const minBoxW = Math.round(W * 0.68);
        const maxBoxW = W - marginX * 2;
        const boxW = Math.min(maxBoxW, Math.max(minBoxW, Math.max(w1, w2) + padX * 2));
        const boxH = padY * 2 + fontTitle + lineGap + fontSub;
        const radius = Math.round(fontTitle * 0.55);

        ctx.save();
        roundRectCanvas(ctx, marginX, marginY, boxW, boxH, radius);
        ctx.fillStyle = "rgba(28, 32, 36, 0.72)";
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.textBaseline = "top";
        ctx.font = `700 ${fontTitle}px system-ui, -apple-system, Roboto, Arial, sans-serif`;
        ctx.fillText(stampLine1, marginX + padX, marginY + padY);

        ctx.font = `400 ${fontSub}px system-ui, -apple-system, Roboto, Arial, sans-serif`;
        ctx.fillText(stampLine2, marginX + padX, marginY + padY + fontTitle + lineGap);
        ctx.restore();
      }

      c.toBlob(blob => res(blob), "image/jpeg", 0.92);
    };
    img.src = URL.createObjectURL(file);
  });
}

function photo(id, ponto, ri, ni, useCam = true) {
  const b = getB().find(x => x[0] == id) || [id, id, 1, ""];
  const f = F(id);
  let subLabel = ponto;
  if (ri >= 0 && ri != null && f.rows[ri] && f.rows[ri].loc) {
    subLabel = `${f.rows[ri].p} ${f.rows[ri].loc}`;
  }

  const i = document.createElement("input");
  i.type = "file";
  i.accept = "image/*";
  if (useCam) i.capture = "environment";
  else i.multiple = true;

  i.onchange = async () => {
    if (!i.files || !i.files.length) return;
    const st = $("#st-msg");
    if (st) st.textContent = "Processando foto HD com carimbo…";

    for (const file of i.files) {
      const d = new Date();
      const stampLine1 = `${b[1]}--${subLabel}`;
      const stampLine2 = formatStampDate(d);
      const bl = await processPhotoHDWithStamp(file, stampLine1, stampLine2);

      const hh = d.toTimeString().slice(0, 8).replace(/:/g, "");
      const cleanPonto = String(ponto).replace(/[^a-zA-Z0-9_-]/g, "");
      const name = `${id}_${cleanPonto}_${d.toISOString().slice(0, 10)}_${hh}_${Math.random().toString(36).slice(2, 5)}.jpg`;

      await pset(name, {
        b: bl,
        id,
        ponto,
        stampTitle: stampLine1,
        stampDate: stampLine2,
        t: d.toISOString(),
        s: 0
      });

      if (ri >= 0 && ri != null && ri !== undefined) f.rows[ri].ph.push(name);
      else if (ni != null && ni >= 0) (f.ncs[ni].ph ??= []).push(name);
      else (f.bepPh ??= []).push(name);
    }
    if (st) st.textContent = "";
    save();
    render();
  };
  i.click();
}

                ${Object.entries(COD).map(([k, v]) => `<option value="${k}" ${n.cod == k ? "selected" : ""}>${k} - ${v[0]}</option>`).join("")}
              </select>
            </div>
          </div>
          <label>Severidade</label>
          ${seg(blockId, `ncs.${i}.sev`, n.sev, [["A", "A (Crítica)", "bad"], ["B", "B (Média)"], ["C", "C (Leve)"]])}

function openBlockModal(editId) {
  const B = getB();
  const ex = editId ? B.find(x => x[0] === editId) : null;
  const id = ex ? ex[0] : "";
  const nome = ex ? ex[1] : "";
  const dupla = ex ? ex[2] : (filterDupla || S.cfg.equipeAtiva || 1);
  const opts = ex ? (ex[3] || "") : "";
  const hasBep = opts.includes("bep");
  const hasDps = opts.includes("dps");
  const isOnly = opts.includes("only");
  const qtdDesc = editId && S.f[editId] ? S.f[editId].rows.length : 8;

  $("#modal-root").innerHTML = `
    <div class="modal-bg" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <h3 style="margin-top:0">${ex ? "Editar Local / Bloco" : "Novo Local / Bloco"}</h3>
        <div class="g2">
          <div>
            <label>Sigla / Código</label>
            <input id="mb-id" value="${esc(id)}" placeholder="Ex.: M, Galp1" ${ex ? "readonly style='opacity:.7'" : ""}>
          </div>
          <div>
            <label>Equipe Responsável</label>
            <select id="mb-dupla">
              <option value="1" ${dupla == 1 ? "selected" : ""}>Equipe A (Dupla 1)</option>
              <option value="2" ${dupla == 2 ? "selected" : ""}>Equipe B (Dupla 2)</option>
            </select>
          </div>
        </div>
        <label>Nome do Lugar / Edifício (aparece no carimbo da foto)</label>
        <input id="mb-nome" value="${esc(nome)}" placeholder="Ex.: edifício A, Bloco M, Subestação...">
        ${!ex ? `
          <label>Quantidade inicial de descidas</label>
          <input id="mb-qtd" type="number" min="0" max="60" value="${qtdDesc}">
        ` : ""}
        <div style="margin-top:10px">
          <label>Configuração do Local</label>
          <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);text-transform:none">
            <input type="checkbox" id="mb-bep" ${hasBep ? "checked" : ""}> Possui BEP (Barramento de Equipotencialização)
          </label>
          <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);text-transform:none">
            <input type="checkbox" id="mb-dps" ${hasDps ? "checked" : ""}> Verificar DPS no QDG
          </label>
          <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);text-transform:none">
            <input type="checkbox" id="mb-only" ${isOnly ? "checked" : ""}> Somente BEP / Aterramento (sem descidas)
          </label>
        </div>
        <div class="row" style="margin-top:14px">
          ${ex ? `<button class="b" style="color:var(--nc)" onclick="deleteBlock('${esc(id)}')">🗑 Excluir</button>` : ""}

          <button class="b" onclick="closeModal()">Cancelar</button>
          <button class="b" style="background:var(--fg);color:var(--bg)" onclick="saveBlockModal('${esc(editId || "")}')">Salvar</button>
        </div>
      </div>
    </div>`;

function saveBlockModal(editId) {
  const B = getB();
  let id = ($("#mb-id").value || "").trim().replace(/[^a-zA-Z0-9_-]/g, "");
  const nome = ($("#mb-nome").value || "").trim();
  const dupla = parseInt($("#mb-dupla").value) || 1;
  const flags = [];
  if ($("#mb-bep").checked) flags.push("bep");
  if ($("#mb-dps").checked) flags.push("dps");
  if ($("#mb-only").checked) flags.push("only");
  const optStr = flags.join(" ");

  if (!nome) { alert("Informe o nome do local/bloco."); return; }
  if (!id) id = nome.slice(0, 4).toUpperCase().replace(/\s+/g, "") + Math.floor(Math.random() * 90 + 10);

  if (editId) {
    const idx = B.findIndex(x => x[0] === editId);
    if (idx >= 0) {
      B[idx] = [editId, nome, dupla, optStr];
      if (S.f[editId]) S.f[editId].dupla = dupla;
    }
  } else {
    if (B.some(x => x[0] === id)) {
      alert("Já existe um local com a sigla " + id + ".");
      return;
    }
    const qtd = Math.max(0, Math.min(60, parseInt($("#mb-qtd")?.value ?? 8)));
    B.push([id, nome, dupla, optStr]);
    const f = F(id);
    f.rows = optStr.includes("only") ? [] : Array.from({length: qtd}, (_, i) => R(i));
  }
  save();
  closeModal();
  render();
}

/* ============================================================================
   GERADOR DE LAUDO PDF (OTIMIZA CÓPIA DAS FOTOS P/ NÃO TRAVAR RAM DO CELULAR)
   ============================================================================ */
function pdfClean(str) {
  return String(str ?? "")
    .replace(/Ω/g, "Ohm")
    .replace(/²/g, "2")
    .replace(/[•·]/g, "-")
    .replace(/[—–]/g, "-")
    .replace(/✓/g, "OK")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^\x20-\x7E]/g, "")
    .replace(/([()\\])/g, "\\$1");
}

function downscaleForPDF(blob) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.width, img.height));
      const w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      c.toBlob(b => {
        const fr = new FileReader();
        fr.onload = () => res({bytes: new Uint8Array(fr.result), w, h});
        fr.readAsArrayBuffer(b);
      }, "image/jpeg", 0.78);
    };
    img.onerror = () => res(null);
    img.src = URL.createObjectURL(blob);
  });
}

async function buildPDFFile(teamFilter = 0) {
  const st = $("#st-msg");
  if (st) st.textContent = "Montando PDF com fotos carimbadas…";
  const allB = getB();
  const B = teamFilter ? allB.filter(b => b[2] == teamFilter) : allB;
  const c = S.cfg;
  const teamTag = teamFilter == 1 ? "Equipe A (Dupla 1)" : (teamFilter == 2 ? "Equipe B (Dupla 2)" : "Equipes A e B");

  const PW = 595.28, PH = 841.89, ML = 36, MR = 36, MT = 40, MB = 42;
  const CW = PW - ML - MR;
  const pages = [];
  const images = [];
  let curOps = [];
  let y = PH - MT;

  function newPage() {
    if (curOps.length) pages.push(curOps.join("\n"));
    curOps = [];
    y = PH - MT;
    rectFill(ML, PH - 34, CW, 18, 0.11, 0.14, 0.13);
    textAt(`LAUDO TECNICO DE INSPECAO E MEDICAO DE SPDA - ${teamTag}`, ML + 6, PH - 28, 8.5, true, 1, 1, 1);
    textAt(c.cliente || "SPDA Campo", PW - MR - 140, PH - 28, 8.5, false, 1, 1, 1);
    y = PH - 52;
  }

  function ensureSpace(hNeeded) {
    if (y - hNeeded < MB) newPage();
  }

  function rectFill(x, ry, w, h, r, g, b) {
    curOps.push(`${r.toFixed(2)} ${g.toFixed(2)} ${b.toFixed(2)} rg ${x.toFixed(2)} ${ry.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
  }

  function rectStroke(x, ry, w, h, r = 0.75, g = 0.78, b = 0.82) {
    curOps.push(`0.6 w ${r.toFixed(2)} ${g.toFixed(2)} ${b.toFixed(2)} RG ${x.toFixed(2)} ${ry.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re S`);
  }

  function textAt(str, x, ty, size = 9.5, bold = false, r = 0.1, g = 0.12, b = 0.15) {
    const s = pdfClean(str);
    curOps.push(`BT /${bold ? "F2" : "F1"} ${size} Tf ${r.toFixed(2)} ${g.toFixed(2)} ${b.toFixed(2)} rg ${x.toFixed(2)} ${ty.toFixed(2)} Td (${s}) Tj ET`);
  }

  newPage();

  rectFill(ML, y - 54, CW, 54, 0.95, 0.96, 0.95);
  rectStroke(ML, y - 54, CW, 54);
  textAt(`CLIENTE / OBRA: ${c.cliente || "Amigos do Bem"}   [${teamTag}]`, ML + 8, y - 14, 10.5, true, 0.11, 0.14, 0.13);
  textAt("Local: " + (c.local || "-") + "   |   Data: " + (c.data || new Date().toISOString().slice(0, 10)), ML + 8, y - 27, 9, false);
  textAt("Operadores: " + (c.eq || "-") + "   |   Aparelho: " + (c.ap || "-"), ML + 8, y - 39, 9, false);
  textAt(`Resp. Tecnico: ${c.resp || "-"} (${c.crea || "-"})   |   Limites: Cont. <= ${c.limC} Ohm / Terra <= ${c.limT} Ohm`, ML + 8, y - 50, 8.5, false, 0.3, 0.35, 0.33);
  y -= 66;

  ensureSpace(40);
  textAt("1. QUADRO GERAL DE PROGRESSO E STATUS DOS BLOCOS", ML, y, 10, true, 0.11, 0.14, 0.13);
  y -= 6;
  rectFill(ML, y - 15, CW, 15, 0.88, 0.9, 0.89);
  textAt("Sigla", ML + 4, y - 11, 8.5, true);
  textAt("Local / Bloco", ML + 42, y - 11, 8.5, true);
  textAt("Equipe", ML + 205, y - 11, 8.5, true);
  textAt("Horario", ML + 255, y - 11, 8.5, true);
  textAt("Solo", ML + 325, y - 11, 8.5, true);
  textAt("Medicoes", ML + 375, y - 11, 8.5, true);
  textAt("Status / NCs", ML + 440, y - 11, 8.5, true);
  y -= 15;

  for (const b of B) {
    ensureSpace(16);
    const bs = blockStats(b);
    const f = bs.f;
    rectStroke(ML, y - 14, CW, 14, 0.85, 0.87, 0.86);
    textAt(b[0], ML + 4, y - 10, 8.5, true);
    textAt((b[1] || "").slice(0, 30), ML + 42, y - 10, 8.5);
    textAt(b[2] == 2 ? "Eq. B" : "Eq. A", ML + 205, y - 10, 8.5);
    textAt(f && (f.hi || f.hf) ? `${f.hi || "--"} a ${f.hf || "--"}` : "-", ML + 255, y - 10, 8);
    textAt(f?.solo || "-", ML + 325, y - 10, 8);
    textAt(bs.totR ? `${bs.medR}/${bs.totR}` : "BEP", ML + 382, y - 10, 8.5);
    if (bs.totNC > 0) textAt(`${bs.totNC} NC(s)`, ML + 440, y - 10, 8.5, true, 0.82, 0.18, 0.18);
    else if (bs.isCompleted) textAt("CONCLUIDO", ML + 440, y - 10, 8.5, true, 0.18, 0.49, 0.31);
    else textAt(bs.status, ML + 440, y - 10, 8, false, 0.45, 0.48, 0.46);
    y -= 14;
  }

  y -= 14;

  for (const b of B) {
    const bs = blockStats(b);
    const f = bs.f;
    if (!bs.isStarted && !bs.totNC) continue;

    ensureSpace(65);
    rectFill(ML, y - 18, CW, 18, 0.11, 0.14, 0.13);
    textAt(`BLOCO / LOCAL: ${b[1]} [${b[0]}]  -  ${teamLabel(b[2])}`, ML + 6, y - 13, 9.5, true, 1, 1, 1);
    y -= 22;

    textAt(`Inicio: ${f.hi || "-"}  |  Fim: ${f.hf || "-"}  |  Solo: ${f.solo || "-"}  |  DPS QDG: ${f.dps || "N/A"}`, ML + 2, y - 8, 8.5, false);
    y -= 12;

    if (b[3]?.includes("bep") || b[3]?.includes("only")) {
      ensureSpace(18);
      textAt(`BEP Integro: ${f.bepOk || "-"}   |   Continuidade BEP->Malha: ${f.bepC || "-"} Ohm   |   Terra no BEP: ${f.bepT || "-"} Ohm`, ML + 2, y - 8, 8.5, true);
      y -= 14;
    }

    if (f.rows && f.rows.length) {
      ensureSpace(32);
      rectFill(ML, y - 14, CW, 14, 0.9, 0.92, 0.91);
      textAt("Ponto / Ref.", ML + 4, y - 10, 8, true);
      textAt("Barra", ML + 115, y - 10, 8, true);
      textAt("Eletrod.", ML + 165, y - 10, 8, true);
      textAt("Caixa", ML + 220, y - 10, 8, true);
      textAt("Cont.(Ohm)", ML + 270, y - 10, 8, true);
      textAt("Terra(Ohm)", ML + 335, y - 10, 8, true);
      textAt("Planta", ML + 400, y - 10, 8, true);
      textAt("Avaliacao", ML + 445, y - 10, 8, true);
      y -= 14;

      for (const r of f.rows) {
        ensureSpace(14);
        const j = judge(r);
        const isBad = j.length || [r.barra, r.eld, r.cx].includes("NC");
        rectStroke(ML, y - 13, CW, 13, 0.88, 0.9, 0.89);
        const label = r.loc ? `${r.p} (${r.loc.slice(0, 14)})` : r.p;
        textAt(label, ML + 4, y - 9.5, 8, true);
        textAt(r.barra || "-", ML + 118, y - 9.5, 8);
        textAt(r.eld || "-", ML + 170, y - 9.5, 8);
        textAt(r.cx || "-", ML + 224, y - 9.5, 8);
        textAt(r.cont || "-", ML + 276, y - 9.5, 8);
        textAt(r.terra || "-", ML + 342, y - 9.5, 8);
        textAt(r.pl || "-", ML + 402, y - 9.5, 8);
        if (isBad) textAt(j.length ? j.join(" ") : "NC Visual", ML + 445, y - 9.5, 7.5, true, 0.82, 0.18, 0.18);
        else if (r.cont || r.terra) textAt("OK", ML + 445, y - 9.5, 8, true, 0.18, 0.49, 0.31);
        else textAt("-", ML + 445, y - 9.5, 8);
        y -= 13;
      }
      y -= 6;
    }

    const blockPhotos = [];
    for (const k of (f.bepPh || [])) blockPhotos.push({k, cap: `${b[1]}--BEP`});
    for (const r of (f.rows || [])) {
      for (const k of (r.ph || [])) blockPhotos.push({k, cap: `${b[1]}--${r.p}`});
    }
    for (let i = 0; i < (f.ncs || []).length; i++) {
      for (const k of (f.ncs[i].ph || [])) blockPhotos.push({k, cap: `${b[1]}--NC-${i + 1}`});
    }

    if (blockPhotos.length) {
      ensureSpace(175);
      textAt(`Relatorio Fotografico c/ Carimbo (${blockPhotos.length} foto(s)):`, ML + 2, y - 9, 8.5, true, 0.11, 0.14, 0.13);
      y -= 14;
      let col = 0;
      const boxW = (CW - 12) / 2, boxH = 155;
      for (const item of blockPhotos) {
        const rec = await pget(item.k);
        if (!rec || !rec.b) continue;
        if (col === 0) ensureSpace(boxH + 18);
        const scaled = await downscaleForPDF(rec.b);
        if (!scaled) continue;
        const imgId = "Im" + (images.length + 1);
        images.push({id: imgId, bytes: scaled.bytes, w: scaled.w, h: scaled.h});

        const bx = ML + col * (boxW + 12);
        const by = y - boxH;
        rectStroke(bx, by - 12, boxW, boxH + 12, 0.8, 0.82, 0.81);

        const sc = Math.min((boxW - 8) / scaled.w, (boxH - 8) / scaled.h);
        const dw = scaled.w * sc, dh = scaled.h * sc;
        const ix = bx + (boxW - dw) / 2, iy = by + (boxH - dh) / 2;
        curOps.push(`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${ix.toFixed(2)} ${iy.toFixed(2)} cm /${imgId} Do Q`);
        textAt(item.cap.slice(0, 42), bx + 4, by - 9, 7.5, true, 0.2, 0.22, 0.2);

        col++;
        if (col === 2) {
          col = 0;
          y -= (boxH + 18);
        }
      }
      if (col > 0) y -= (boxH + 18);
    }

    y -= 10;
  }

  if (curOps.length) pages.push(curOps.join("\n"));

  const chunks = [];
  let offset = 0;
  const offsets = [];
  const enc = new TextEncoder();

  function pushStr(s) {
    const b = enc.encode(s);
    chunks.push(b);
    offset += b.length;
  }
  function pushBytes(b) {
    chunks.push(b);
    offset += b.length;
  }
  function startObj(id) {
    offsets[id] = offset;
    pushStr(`${id} 0 obj\n`);
  }
  function endObj() {
    pushStr(`\nendobj\n`);
  }

  pushStr("%PDF-1.4\n%\xFF\xFF\xFF\xFF\n");

  const firstImgObj = 5;
  const firstPageObj = firstImgObj + images.length;
  const pageKids = [];

  startObj(1); pushStr(`<< /Type /Catalog /Pages 2 0 R >>`); endObj();
  startObj(3); pushStr(`<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`); endObj();
  startObj(4); pushStr(`<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`); endObj();

  const xobjEntries = [];
  for (let i = 0; i < images.length; i++) {
    const oid = firstImgObj + i;
    const im = images[i];
    xobjEntries.push(`/${im.id} ${oid} 0 R`);
    startObj(oid);
    pushStr(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);
    pushBytes(im.bytes);
    pushStr(`\nendstream`);
    endObj();
  }

  for (let i = 0; i < pages.length; i++) {
    const pObj = firstPageObj + i * 2;
    const cObj = pObj + 1;
    pageKids.push(`${pObj} 0 R`);
    const contentBytes = enc.encode(pages[i]);

    startObj(pObj);
    pushStr(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW.toFixed(2)} ${PH.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << ${xobjEntries.join(" ")} >> >> /Contents ${cObj} 0 R >>`);
    endObj();

    startObj(cObj);
    pushStr(`<< /Length ${contentBytes.length} >>\nstream\n`);
    pushBytes(contentBytes);
    pushStr(`\nendstream`);
    endObj();
  }

  startObj(2);
  pushStr(`<< /Type /Pages /Kids [ ${pageKids.join(" ")} ] /Count ${pages.length} >>`);
  endObj();

  const totalObjs = firstPageObj + pages.length * 2;
  const xrefPos = offset;
  pushStr(`xref\n0 ${totalObjs}\n0000000000 65535 f \n`);
  for (let i = 1; i < totalObjs; i++) {
    pushStr(String(offsets[i] || 0).padStart(10, "0") + " 00000 n \n");
  }
  pushStr(`trailer\n<< /Size ${totalObjs} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`);

  if (st) st.textContent = "";
  const pdfBlob = new Blob(chunks, {type: "application/pdf"});
  const eqPrefix = teamFilter == 1 ? "EquipeA_" : (teamFilter == 2 ? "EquipeB_" : "");
  const fname = `${eqPrefix}Laudo_SPDA_${(c.cliente || "Campo").replace(/[^a-zA-Z0-9_-]/g, "_")}_${(c.data || new Date().toISOString().slice(0, 10))}.pdf`;
  return new File([pdfBlob], fname, {type: "application/pdf"});
}

        ${f.rows.length ? `
          <table class="p-tbl">
            <thead><tr><th>Ponto</th><th>Barra</th><th>Eletroduto</th><th>Caixa</th><th>Cont. (Ω)</th><th>Terra (Ω)</th><th>Planta</th><th>Status</th></tr></thead>
            <tbody>
              ${f.rows.map(r => {
                const j = judge(r);
                const bad = j.length || [r.barra, r.eld, r.cx].includes("NC");
                return `<tr>
                  <td><b>${esc(r.p)}</b> ${r.loc ? `<small>(${esc(r.loc)})</small>` : ""}</td>
                  <td>${esc(r.barra || "-")}</td>
                  <td>${esc(r.eld || "-")}</td>
                  <td>${esc(r.cx || "-")}</td>
                  <td>${esc(r.cont || "-")}</td>
                  <td>${esc(r.terra || "-")}</td>
                  <td>${esc(r.pl || "-")}</td>
                  <td style="font-weight:bold">${bad ? (j.join(", ") || "NC") : (r.cont || r.terra ? "OK" : "-")}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>` : ""}
        ${photos.length ? `
          <div class="p-grid-ph">
            ${photos.map(p => `<div class="p-ph"><img data-ph="${esc(p.k)}"><div style="font-size:10px;margin-top:2px">${esc(p.cap)}</div></div>`).join("")}
          </div>` : ""}
      </div>`;
  }

  $("#print-area").innerHTML = html;
  await hydrateThumbs();
  setTimeout(() => window.print(), 250);
}
