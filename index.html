<style>
:root{
  --bg:#f5f6f4;--panel:#ffffff;--fg:#1c2421;--muted:#5f6b66;--line:#d6dbd8;

const LIB_CHK = [
  "Todos os blocos da Equipe A (Dupla 1) inspecionados e medidos",
  "Todos os blocos da Equipe B (Dupla 2) inspecionados e medidos",
  "Continuidade elétrica das descidas conferida (critério <= 0,20 Ohm — NBR 5419-3)",
  "Resistência de aterramento medida nas caixas/BEP (<= 10 Ohm ideal / <= 20 Ohm solo seco)",

];

let S = {
  updatedAt: 0,
  cfg: {
    empresa: "TH ELÉTRICA — ENGENHARIA E LAUDOS TÉCNICOS",
    cliente: "Fazenda Amigos do Bem",
    local: "Serra do Catimbau, Buíque/PE",
    proposta: "Projeto Prioriza Cód. 260053 • ABNT NBR 5419:2015",
    data: new Date().toISOString().slice(0,10),
    equipeAtiva: 1,
    driveA: DRIVE_FOLDERS[1].url,
    driveB: DRIVE_FOLDERS[2].url,
    resFoto: 2560,
    carimboOn: 1,
    soPreenchidos: 1,
    resp: "",
    crea: "",
    art: "",
    limC: 0.2,
    limT: 10,
    limTSeco: 20,
    url: "",
    tok: "",
    eq: "",
    ap: "",
    apTerra: ""
  },
  reposicao: {

    conectoresQtd: "",
    conectoresLocais: "",
    outros: "",
    anotacoesLivres: ""
  },
  blocos: null,
  lib: {},
  f: {}
};

let db = null, view = "", activeTab = "blocos", searchQ = "", filterMode = "ALL", filterDupla = 0, photoURLCache = {};
let lastSnapWrite = 0, lastSavedTimeStr = "";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function teamLabel(d) {
  return d == 2 ? "Equipe B (Dupla 2)" : "Equipe A (Dupla 1)";
}

function getDriveUrl(teamNum) {
  if (teamNum == 2) return S.cfg.driveB || DRIVE_FOLDERS[2].url;
  return S.cfg.driveA || DRIVE_FOLDERS[1].url;
}

function getB() {
  if (!Array.isArray(S.blocos) || !S.blocos.length) {
    S.blocos = DEFAULT_B.map(x => [...x]);
  }
  return S.blocos;
}

function idb() {
  return new Promise(r => {
    try {
      const q = indexedDB.open("spda", 1);
      q.onupgradeneeded = () => {
        if (!q.result.objectStoreNames.contains("kv")) q.result.createObjectStore("kv");
        if (!q.result.objectStoreNames.contains("ph")) q.result.createObjectStore("ph");
      };
      q.onsuccess = () => r(q.result);
      q.onerror = () => r(null);
    } catch (e) {
      r(null);
    }
  });
}

const tx = (st, m, f) => new Promise(r => {
  if (!db) return r(null);
  try {
    const t = db.transaction(st, m), o = f(t.objectStore(st));
    t.oncomplete = () => r(o && o.result);
    t.onerror = () => r(null);
  } catch (e) {
    r(null);
  }
});
const kget = k => tx("kv", "readonly", s => s.get(k));
const kset = (k, v) => tx("kv", "readwrite", s => s.put(v, k));
const pall = () => tx("ph", "readonly", s => s.getAll()).then(r => r || []);
const pkeys = () => tx("ph", "readonly", s => s.getAllKeys()).then(r => r || []);
const pset = (k, v) => tx("ph", "readwrite", s => s.put(v, k));
const pget = k => tx("ph", "readonly", s => s.get(k));
const pdel = k => tx("ph", "readwrite", s => s.delete(k));

/* ============================================================================
   SISTEMA BLINDADO CONTRA PERDA DE DADOS (DUPLA PERSISTÊNCIA SÍNCRONA + IDB)
   ============================================================================ */
function updateSaveIndicator() {
  const el = $("#save-ind");
  if (el && lastSavedTimeStr) {
    el.textContent = `✓ Salvo ${lastSavedTimeStr}`;
  }
}

function getSnapshots() {
  try {
    const raw = localStorage.getItem(LS_SNAPS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveNow(forceSnapshot = false) {
  S.updatedAt = Date.now();
  lastSavedTimeStr = new Date(S.updatedAt).toTimeString().slice(0, 8);
  const serialized = JSON.stringify(S);

  // 1. Gravação SÍNCRONA imediata em localStorage (zero risco se fechar a aba/app na hora)
  try {
    localStorage.setItem(LS_STATE_KEY, serialized);
    if (forceSnapshot || (S.updatedAt - lastSnapWrite > 15000)) {
      lastSnapWrite = S.updatedAt;
      const snaps = getSnapshots();
      snaps.unshift({ t: S.updatedAt, h: lastSavedTimeStr, data: serialized });
      if (snaps.length > 5) snaps.length = 5;
      localStorage.setItem(LS_SNAPS_KEY, JSON.stringify(snaps));
    }
  } catch (e) {
    // Caso localStorage atinja limite, tenta salvar sem snapshots antigos
    try {
      localStorage.removeItem(LS_SNAPS_KEY);
      localStorage.setItem(LS_STATE_KEY, serialized);
    } catch (e2) {}
  }

  // 2. Gravação em IndexedDB (assíncrona imediata)
  if (db) {
    kset("S", JSON.parse(serialized));
  }

  updateSaveIndicator();
}

let idbTimer;
function save() {
  clearTimeout(idbTimer);
  saveNow(false);
  idbTimer = setTimeout(() => saveNow(false), 120);
}

window.addEventListener("pagehide", () => saveNow(true));
window.addEventListener("beforeunload", () => saveNow(true));
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") saveNow(true);
});

function countFilledMetrics(st) {
  if (!st || !st.f) return 0;
  let n = 0;
  for (const k of Object.keys(st.f)) {
    const f = st.f[k];
    if (!f) continue;
    if (f.hi || f.hf || f.solo || f.bepC || f.bepT || f.obs) n++;
    if (Array.isArray(f.rows)) {
      for (const r of f.rows) {
        if (r.cont !== "" || r.terra !== "" || r.barra || r.eld || r.cx) n += 2;
      }
    }
    if (Array.isArray(f.ncs)) n += f.ncs.length * 2;
  }
  return n;
}

function loadBestState(lsRaw, idbState) {
  let lsState = null;
  try {
    if (lsRaw) lsState = JSON.parse(lsRaw);
  } catch (e) {}

  if (!lsState && !idbState) return null;
  if (lsState && !idbState) return lsState;
  if (!lsState && idbState) return idbState;

  const lsTime = Number(lsState.updatedAt || 0);
  const idbTime = Number(idbState.updatedAt || 0);
  if (lsTime !== idbTime) return lsTime > idbTime ? lsState : idbState;

  return countFilledMetrics(lsState) >= countFilledMetrics(idbState) ? lsState : idbState;
}

const R = i => ({
  p: "D" + String(i + 1).padStart(2, "0"),
  loc: "",
  barra: "",
  eld: "",
  cx: "",
  cont: "",
  terra: "",
  horaFoto: "",

});

function F(id) {
  const b = getB().find(x => x[0] == id) || [id, id, 1, "", 10];
  const o = b[3] || "";
  const defCount = o.includes("only") ? 0 : (typeof b[4] === "number" ? b[4] : 10);
  const f = S.f[id] ??= {
    id,
    data: "",
    hi: "",
    hf: "",
    horaConc: "",
    solo: "",
    clima: "",
    obs: "",
    reparosCampo: "",
    respBloco: "",
    visto: "",
    dupla: b[2],
    chk: {},
    fachadaPh: [],
    fachadaHora: "",
    telhadoPh: [],
    telhadoHora: "",
    bepOk: "",
    bepAcess: "",
    bepCorr: "",
    bepResLig: "",
    bepPlaca: "",
    bepC: "",
    bepT: "",
    bepHora: "",
    bepPh: [],
    dps: "",
    dpsCor: "",
    rows: Array.from({length: defCount}, (_, i) => R(i)),
    ncs: [],
    done: {vis: 0, med: 0, foto: 0, pl: 0}
  };
  // Garante campos novos em registros migrados
  f.chk ??= {};
  f.fachadaPh ??= [];
  f.telhadoPh ??= [];
  f.bepPh ??= [];
  f.ncs ??= [];
  f.rows ??= [];
  f.done ??= {vis: 0, med: 0, foto: 0, pl: 0};
  f.rows.forEach(r => { r.ph ??= []; r.horaFoto ??= ""; });
  return f;
}

const num = v => parseFloat(String(v ?? "").replace(",", "."));

function judge(r) {
  const c = num(r.cont), t = num(r.terra), bad = [];
  if (!isNaN(c) && c > S.cfg.limC) bad.push(`Cont. ${c} Ohm > ${S.cfg.limC}`);
  if (!isNaN(t) && t > S.cfg.limT) bad.push(`Terra ${t} Ohm > ${S.cfg.limT}`);
  return bad;
}

function rowDiagnosis(r) {
  const j = judge(r);
  const visBad = [];
  if (r.barra === "NC") visBad.push("Barra/Fixação NC");
  if (r.eld === "NC") visBad.push("Eletroduto/Placa NC");
  if (r.cx === "NC") visBad.push("Caixa/Bimetálico NC");
  const allBad = [...visBad, ...j];
  if (allBad.length) {
    return {ok: false, measured: true, short: "REPROVADO (NC)", detail: allBad.join(" | ")};
  }
  if (r.cont !== "" || r.terra !== "" || [r.barra, r.eld, r.cx].includes("OK")) {
    return {ok: true, measured: true, short: "APROVADO (OK)", detail: "Dentro dos parâmetros da NBR 5419"};
  }
  return {ok: true, measured: false, short: "NÃO MEDIDO", detail: "Sem leitura registrada"};
}

function collectAllBlockNCs(b) {
  const f = F(b[0]);
  const list = [];
  (f.ncs || []).forEach(n => {
    const info = COD[n.cod] || ["Desvio técnico identificado em campo", n.sev || "B", "Realizar adequação conforme NBR 5419:2015."];
    list.push({
      code: `NC-${String(list.length + 1).padStart(2, "0")}`,
      ponto: n.ponto || "Geral",
      codRef: n.cod || "—",
      horaFoto: n.horaFoto || "—",
      titulo: info[0],
      sev: n.sev || info[1] || "B",
      detalhe: n.det || info[2],
      ph: n.ph || []
    });
  });

  (f.rows || []).forEach(r => {
    const c = num(r.cont), t = num(r.terra);
    const issues = [];
    let sev = "B";
    const recs = [];
    if (!isNaN(c) && c > S.cfg.limC) {
      issues.push(`Continuidade medida = ${r.cont} Ohm (limite <= ${S.cfg.limC} Ohm)`);
      sev = "A";
      recs.push(COD.C1[2]);
    }
    if (!isNaN(t) && t > S.cfg.limT) {
      issues.push(`Resistência de terra = ${r.terra} Ohm (limite <= ${S.cfg.limT} Ohm)`);
      sev = "A";
      recs.push(COD.C10[2]);
    }
    if (r.barra === "NC") {
      issues.push("Barra chata / fixação com anomalia (NC)");
      recs.push(COD.C7[2]);
    }
    if (r.eld === "NC") {
      issues.push("Eletroduto PVC / placa de advertência ausente ou danificado (NC)");
      recs.push(COD.C6[2]);
    }
    if (r.cx === "NC") {
      issues.push("Caixa de inspeção / conector bimetálico com anomalia (NC)");
      recs.push(COD.C4[2]);
    }
    if (issues.length) {
      const pontoName = r.loc ? `${r.p} (${r.loc})` : r.p;
      list.push({
        code: `NC-${String(list.length + 1).padStart(2, "0")}`,
        ponto: pontoName,
        codRef: !isNaN(c) && c > S.cfg.limC ? "C1/C10" : "Visual",
        horaFoto: r.horaFoto || "—",
        titulo: issues.join("; "),
        sev,
        detalhe: recs.join(" "),
        ph: r.ph || []
      });
    }
  });

  return list;
}

function blockStats(b) {
  const f = F(b[0]);
  const o = b[3] || "";
  const isOnly = o.includes("only");
  const totR = f.rows.length;
  const medR = f.rows.filter(r => r.cont !== "" || r.terra !== "" || r.barra || r.eld || r.cx).length;
  const ncsRows = f.rows.filter(r => judge(r).length || [r.barra, r.eld, r.cx].includes("NC")).length;
  const totNC = f.ncs.length + ncsRows;
  const totPh = (f.fachadaPh || []).length + (f.telhadoPh || []).length + (f.bepPh || []).length +
    f.rows.reduce((a, r) => a + (r.ph || []).length, 0) +
    f.ncs.reduce((a, n) => a + (n.ph || []).length, 0);
  const chkCount = Object.values(f.chk || {}).filter(Boolean).length;

  const isCompleted = !!(f.done && f.done.vis && f.done.med && f.done.foto && f.done.pl) ||
    (isOnly ? (f.bepOk && (f.bepC || f.bepT) && totPh > 0) : (totR > 0 && medR === totR && chkCount >= 4 && totPh > 0));
  const isStarted = !!(medR > 0 || chkCount > 0 || totPh > 0 || f.bepOk || f.bepC || f.bepT || f.hi || f.done.vis || f.done.med || f.reparosCampo);

  let status = "PENDENTE";
  if (totNC > 0 && !f.done.pl) status = "NC";
  else if (isCompleted) status = "CONCLUIDO";
  else if (isStarted) status = "ANDAMENTO";

  const missing = [];
  if (!isOnly && chkCount < CHK.length && !f.done.vis) missing.push(`Checklist (${chkCount}/${CHK.length})`);
  if (!isOnly && medR < totR && !f.done.med) missing.push(`Medições (${medR}/${totR})`);
  if ((o.includes("bep") || isOnly) && !f.bepC && !f.bepT) missing.push("Medir BEP");
  if (totPh === 0 && !f.done.foto) missing.push("Fotos HD");
  if (!f.done.pl) missing.push("Planta A3");

  return {f, totR, medR, totNC, totPh, chkCount, isCompleted, isStarted, status, missing};
}

  if (photoURLCache[name]) return photoURLCache[name];
  const rec = await pget(name);
  if (rec && rec.b) {
    const u = URL.createObjectURL(rec.b);
    photoURLCache[name] = u;
    return u;
  }
  return "";
}

async function delPhoto(id, kind, idx, pi, name) {
  if (!confirm("Excluir esta foto?")) return;
  const f = F(id);
  if (kind === "bep") (f.bepPh || []).splice(pi, 1);
  else if (kind === "fachada") (f.fachadaPh || []).splice(pi, 1);
  else if (kind === "telhado") (f.telhadoPh || []).splice(pi, 1);
  else if (kind === "row") f.rows[idx].ph.splice(pi, 1);
  else if (kind === "nc") (f.ncs[idx].ph || []).splice(pi, 1);

/* ============================================================================
   CAPTURA DE FOTO EM HD + CARIMBO + REGISTRO AUTOMÁTICO DE HORA DA FOTO
   ============================================================================ */
function formatStampDate(d) {
  const meses = ["jan.", "fev.", "mar.", "abr.", "mai.", "jun.", "jul.", "ago.", "set.", "out.", "nov.", "dez."];
  const dia = d.getDate();
  const mes = meses[d.getMonth()];
  const ano = d.getFullYear();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const ss = String(d.getSeconds()).padStart(2, "0");
  return `${dia} de ${mes} de ${ano} ${hh}:${mm}:${ss}`;
}

function roundRectCanvas(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function processPhotoHDWithStamp(file, stampLine1, stampLine2, stampLine3 = "") {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const maxDim = Number(S.cfg.resFoto) || 2560;
      const scale = maxDim > 0 ? Math.min(1, maxDim / Math.max(img.width, img.height)) : 1;
      const W = Math.round(img.width * scale);
      const H = Math.round(img.height * scale);

      const c = document.createElement("canvas");
      c.width = W;
      c.height = H;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, W, H);

      if (S.cfg.carimboOn !== 0) {
        const refSide = Math.min(W, H);
        const marginX = Math.round(refSide * 0.035);
        const marginY = Math.round(refSide * 0.035);
        const fontTitle = Math.max(24, Math.round(refSide * 0.048));
        const fontSub = Math.max(20, Math.round(refSide * 0.038));
        const padX = Math.round(fontTitle * 0.72);
        const padY = Math.round(fontTitle * 0.62);
        const lineGap = Math.round(fontTitle * 0.34);

        ctx.font = `700 ${fontTitle}px system-ui, -apple-system, Roboto, Arial, sans-serif`;
        const w1 = ctx.measureText(stampLine1).width;
        ctx.font = `400 ${fontSub}px system-ui, -apple-system, Roboto, Arial, sans-serif`;
        const w2 = ctx.measureText(stampLine2).width;
        const w3 = stampLine3 ? ctx.measureText(stampLine3).width : 0;

        const minBoxW = Math.round(W * 0.72);
        const maxBoxW = W - marginX * 2;
        const boxW = Math.min(maxBoxW, Math.max(minBoxW, Math.max(w1, w2, w3) + padX * 2));
        const extraH = stampLine3 ? (fontSub + lineGap) : 0;
        const boxH = padY * 2 + fontTitle + lineGap + fontSub + extraH;
        const radius = Math.round(fontTitle * 0.52);

        ctx.save();
        roundRectCanvas(ctx, marginX, marginY, boxW, boxH, radius);
        ctx.fillStyle = "rgba(22, 26, 30, 0.78)";
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.textBaseline = "top";
        ctx.font = `700 ${fontTitle}px system-ui, -apple-system, Roboto, Arial, sans-serif`;
        ctx.fillText(stampLine1, marginX + padX, marginY + padY);

        ctx.font = `400 ${fontSub}px system-ui, -apple-system, Roboto, Arial, sans-serif`;
        ctx.fillText(stampLine2, marginX + padX, marginY + padY + fontTitle + lineGap);

        if (stampLine3) {
          ctx.fillStyle = "#fde047";
          ctx.font = `600 ${fontSub}px system-ui, -apple-system, Roboto, Arial, sans-serif`;
          ctx.fillText(stampLine3, marginX + padX, marginY + padY + fontTitle + lineGap * 2 + fontSub);
        }
        ctx.restore();
      }

      c.toBlob(blob => res(blob), "image/jpeg", 0.92);
    };
    img.src = URL.createObjectURL(file);
  });
}

async function attachPhotoBlob(id, ponto, ri, ni, blobOrFile, kindOverride = "", dateObj = null) {
  const b = getB().find(x => x[0] == id) || [id, id, 1, ""];
  const f = F(id);
  let subLabel = ponto;
  let extraMeasure = "";

  if (ri >= 0 && ri != null && f.rows[ri]) {
    const r = f.rows[ri];
    if (r.loc) subLabel = `${r.p} (${r.loc})`;
    const parts = [];
    if (r.cont !== "") parts.push(`Cont: ${r.cont} Ohm`);
    if (r.terra !== "") parts.push(`Terra: ${r.terra} Ohm`);
    if (parts.length) extraMeasure = parts.join("  |  ");
  } else if (kindOverride === "bep" || ponto === "BEP") {
    const parts = [];
    if (f.bepC !== "") parts.push(`Cont BEP: ${f.bepC} Ohm`);
    if (f.bepT !== "") parts.push(`Terra BEP: ${f.bepT} Ohm`);
    if (parts.length) extraMeasure = parts.join("  |  ");
  }

  const d = dateObj || new Date();
  const stampLine1 = `${b[1]}--${subLabel}`;
  const stampLine2 = formatStampDate(d);
  const horaFotoStr = d.toTimeString().slice(0, 8);
  const bl = await processPhotoHDWithStamp(blobOrFile, stampLine1, stampLine2, extraMeasure);

  const hh = horaFotoStr.replace(/:/g, "");
  const cleanPonto = String(ponto).replace(/[^a-zA-Z0-9_-]/g, "");
  const name = `${id}_${cleanPonto}_${d.toISOString().slice(0, 10)}_${hh}_${Math.random().toString(36).slice(2, 5)}.jpg`;

  await pset(name, {
    b: bl,
    id,
    ponto,
    kind: kindOverride || (ri >= 0 ? "row" : (ni >= 0 ? "nc" : "bep")),
    stampTitle: stampLine1,
    stampDate: stampLine2,
    horaFoto: horaFotoStr,
    extraMeasure,
    t: d.toISOString(),
    s: 0
  });

  if (kindOverride === "fachada") {
    f.fachadaPh.push(name);
    f.fachadaHora = horaFotoStr;
  } else if (kindOverride === "telhado") {
    f.telhadoPh.push(name);
    f.telhadoHora = horaFotoStr;
  } else if (ri >= 0 && ri != null && ri !== undefined) {
    f.rows[ri].ph.push(name);
    f.rows[ri].horaFoto = horaFotoStr;
    f.rows[ri].fotoVisorOk = 1;
  } else if (ni != null && ni >= 0) {
    (f.ncs[ni].ph ??= []).push(name);
    f.ncs[ni].horaFoto = horaFotoStr;
  } else {
    (f.bepPh ??= []).push(name);
    f.bepHora = horaFotoStr;
  }
  saveNow(true);
  return name;
}

function photo(id, ponto, ri, ni, useCam = true, kindOverride = "") {
  const i = document.createElement("input");
  i.type = "file";
  i.accept = "image/*";
  if (useCam) i.capture = "environment";
  else i.multiple = true;

  i.onchange = async () => {
    if (!i.files || !i.files.length) return;
    const st = $("#st-msg");
    if (st) st.textContent = "Processando foto HD com carimbo…";

    for (const file of i.files) {
      await attachPhotoBlob(id, ponto, ri, ni, file, kindOverride);
    }
    if (st) st.textContent = "";
    render();
  };
  i.click();
}

/* ============================================================================
   GERADOR DE PDF NATIVO COM IMAGENS + WINANSI ACENTUADO + ANEXO P/ IA
   ============================================================================ */
function toWinAnsiLiteral(str) {
  const cleaned = String(str ?? "")
    .replace(/Ω/g, "Ohm")
    .replace(/≤/g, "<=")
    .replace(/≥/g, ">=")
    .replace(/[•·]/g, "-")
    .replace(/[—–]/g, "-")
    .replace(/[“”]/g, '"')
    .replace(/[‘’]/g, "'")
    .replace(/✓/g, "OK")
    .replace(/✕/g, "X")
    .replace(/×/g, "x");

  let out = "";
  for (let i = 0; i < cleaned.length; i++) {
    const code = cleaned.charCodeAt(i);
    if (code === 40 || code === 41 || code === 92) { // ( ) \
      out += "\\" + cleaned[i];
    } else if (code >= 32 && code <= 126) {
      out += cleaned[i];
    } else if (code >= 160 && code <= 255) {
      // Latin-1 / WinAnsi octal escape -> mantém 100% ASCII no stream e exibe á,é,í,ó,ú,ã,õ,ç,²,° perfeitamente!
      out += "\\" + code.toString(8).padStart(3, "0");
    } else {
      out += " ";
    }
  }
  return out;
}

function estimateWidth(str, size, bold = false) {
  const s = String(str ?? "");
  let w = 0;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if ("il.,;:|!I1[]()".includes(ch)) w += 0.28;
    else if ("mwMW@#%&".includes(ch)) w += 0.80;
    else if (ch >= "A" && ch <= "Z") w += 0.66;
    else w += 0.52;
  }
  return w * size * (bold ? 1.05 : 1.0);
}

function wrapCellText(str, maxWidthPt, size, bold = false) {
  const rawParagraphs = String(str ?? "").split(/\r?\n/);
  const lines = [];
  for (const para of rawParagraphs) {
    const words = para.trim().split(/\s+/).filter(Boolean);
    if (!words.length) {
      lines.push("");
      continue;
    }
    let cur = "";
    for (const w of words) {
      const cand = cur ? cur + " " + w : w;
      if (estimateWidth(cand, size, bold) <= maxWidthPt) {
        cur = cand;
      } else {
        if (cur) lines.push(cur);
        // Caso uma única palavra seja maior que a coluna, quebra em pedaços
        if (estimateWidth(w, size, bold) > maxWidthPt) {
          let part = "";
          for (const ch of w) {
            if (estimateWidth(part + ch, size, bold) > maxWidthPt && part) {
              lines.push(part);
              part = ch;
            } else {
              part += ch;
            }
          }
          cur = part;
        } else {
          cur = w;
        }
      }
    }
    if (cur) lines.push(cur);
  }
  return lines.length ? lines : [""];
}

function downscaleForPDF(blob) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1000 / Math.max(img.width, img.height));
      const w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      c.toBlob(b => {
        const fr = new FileReader();
        fr.onload = () => res({bytes: new Uint8Array(fr.result), w, h});
        fr.readAsArrayBuffer(b);
      }, "image/jpeg", 0.82);
    };
    img.onerror = () => res(null);
    img.src = URL.createObjectURL(blob);
  });
}

  const pageKids = [];

  startObj(1); pushStr(`<< /Type /Catalog /Pages 2 0 R >>`); endObj();
  startObj(3); pushStr(`<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`); endObj();
  startObj(4); pushStr(`<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`); endObj();

  const xobjEntries = [];
  for (let i = 0; i < images.length; i++) {
    const oid = firstImgObj + i;
    const im = images[i];
    xobjEntries.push(`/${im.id} ${oid} 0 R`);
    startObj(oid);
    pushStr(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);
    pushBytes(im.bytes);
    pushStr(`\nendstream`);
    endObj();
  }

  for (let i = 0; i < pages.length; i++) {
    const pObj = firstPageObj + i * 2;
    const cObj = pObj + 1;
    pageKids.push(`${pObj} 0 R`);
    const contentBytes = enc.encode(pages[i]);

    startObj(pObj);
    pushStr(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW.toFixed(2)} ${PH.toFixed(2)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << ${xobjEntries.join(" ")} >> >> /Contents ${cObj} 0 R >>`);
    endObj();

    startObj(cObj);
    pushStr(`<< /Length ${contentBytes.length} >>\nstream\n`);
    pushBytes(contentBytes);
    pushStr(`\nendstream`);
    endObj();
  }

  startObj(2);
  pushStr(`<< /Type /Pages /Kids [ ${pageKids.join(" ")} ] /Count ${pages.length} >>`);
  endObj();

  const totalObjs = firstPageObj + pages.length * 2;
  const xrefPos = offset;
  pushStr(`xref\n0 ${totalObjs}\n0000000000 65535 f \n`);
  for (let i = 1; i < totalObjs; i++) {
    pushStr(String(offsets[i] || 0).padStart(10, "0") + " 00000 n \n");
  }
  pushStr(`trailer\n<< /Size ${totalObjs} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`);

  if (st) st.textContent = "";
  const pdfBlob = new Blob(chunks, {type: "application/pdf"});
  const eqPrefix = teamFilter == 1 ? "EquipeA_" : (teamFilter == 2 ? "EquipeB_" : "");
  const fname = `${eqPrefix}Laudo_SPDA_${(c.cliente || "Campo").replace(/[^a-zA-Z0-9_-]/g, "_")}_${(c.data || new Date().toISOString().slice(0, 10))}.pdf`;
  return new File([pdfBlob], fname, {type: "application/pdf"});
}

/* ============================================================================
   GERADOR NATIVO DE DOCUMENTO MICROSOFT WORD (.DOCX - OPENXML ZIP)
   ============================================================================ */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  }
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function buildZipBlob(files) {
  const enc = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const data = f.data instanceof Uint8Array ? f.data : enc.encode(String(f.data));
    const crc = crc32(data);
    const len = data.length;

    const lhdr = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(lhdr.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, 0, true);
    lv.setUint16(12, 0x4A21, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, len, true);
    lv.setUint32(22, len, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    lhdr.set(nameBytes, 30);

    localParts.push(lhdr, data);

    const chdr = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(chdr.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0x4A21, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, len, true);
    cv.setUint32(24, len, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    chdr.set(nameBytes, 46);

    centralParts.push(chdr);
    offset += lhdr.length + len;
  }

  const centralSize = centralParts.reduce((a, b) => a + b.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  return new Blob([...localParts, ...centralParts, eocd], {
    type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
  });
}

function xmlEsc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function prepareImageForWord(blob) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1400 / Math.max(img.width, img.height));
      const w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      c.toBlob(b => {
        const fr = new FileReader();
        fr.onload = () => res({bytes: new Uint8Array(fr.result), w, h});
        fr.readAsArrayBuffer(b);
      }, "image/jpeg", 0.86);
    };
    img.onerror = () => res(null);
    img.src = URL.createObjectURL(blob);
  });
}

function wPara(text, opts = {}) {
  const align = opts.align ? `<w:jc w:val="${opts.align}"/>` : "";
  const spaceBefore = opts.before ?? 60;
  const spaceAfter = opts.after ?? 80;
  const shading = opts.bg ? `<w:shd w:val="clear" w:color="auto" w:fill="${opts.bg}"/>` : "";
  const bold = opts.bold ? "<w:b/>" : "";
  const italic = opts.italic ? "<w:i/>" : "";
  const color = opts.color ? `<w:color w:val="${opts.color}"/>` : "";
  const sz = opts.size || 20;
  return `<w:p>
    <w:pPr><w:spacing w:before="${spaceBefore}" w:after="${spaceAfter}"/>${align}${shading}</w:pPr>
    <w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${bold}${italic}${color}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r>
  </w:p>`;
}

function wCell(contentXml, opts = {}) {
  const width = opts.w ? `<w:tcW w:w="${opts.w}" w:type="dxa"/>` : "";
  const span = opts.span ? `<w:gridSpan w:val="${opts.span}"/>` : "";
  const bg = opts.bg ? `<w:shd w:val="clear" w:color="auto" w:fill="${opts.bg}"/>` : "";
  const vAlign = `<w:vAlign w:val="${opts.vAlign || "center"}"/>`;
  return `<w:tc><w:tcPr>${width}${span}${bg}${vAlign}</w:tcPr>${contentXml}</w:tc>`;
}

function wCellText(text, opts = {}) {
  return wCell(wPara(text, {
    bold: opts.bold,
    color: opts.color,
    size: opts.size || 18,
    align: opts.align || "left",
    before: 40,
    after: 40
  }), opts);
}

        <w:top w:val="single" w:sz="6" w:space="0" w:color="B0B8C4"/>

      const rowsToRender = activeRows.length ? activeRows : f.rows;

            w: 1900, bold: true,

  bodyParts.push(wPara("4. RESPONSABILIDADE TÉCNICA E CARIMBO DA RT / ART", {bold: true, size: 22, color: "1F3A5F", before: 120, after: 60}));

</Types>`;
  const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;
  const docRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  ${mediaFiles.map(m => `<Relationship Id="${m.rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.fileName}"/>`).join("\n  ")}
</Relationships>`;
  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
            xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
            xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">
  <w:body>
    ${bodyParts.join("\n")}
    <w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="850" w:right="850" w:bottom="850" w:left="850"/></w:sectPr>
  </w:body>
</w:document>`;

  const docxBlob = buildZipBlob([
    {name: "[Content_Types].xml", data: contentTypesXml},
    {name: "_rels/.rels", data: rootRelsXml},
    {name: "word/_rels/document.xml.rels", data: docRelsXml},
    {name: "word/document.xml", data: documentXml},
    ...mediaFiles.map(m => ({name: `word/media/${m.fileName}`, data: m.bytes}))
  ]);
  if (st) st.textContent = "";
  const eqPrefix = teamFilter == 1 ? "EquipeA_" : (teamFilter == 2 ? "EquipeB_" : "");
  const fname = `${eqPrefix}Laudo_SPDA_${(c.cliente || "Campo").replace(/[^a-zA-Z0-9_-]/g, "_")}_${(c.data || new Date().toISOString().slice(0, 10))}.docx`;
  return new File([docxBlob], fname, {type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

async function downloadWord(teamFilter = 0) {
  const file = await buildWordDocxFile(teamFilter);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  a.click();
}

async function shareWord(teamFilter = 0) {
  const file = await buildWordDocxFile(teamFilter);
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try {
      await navigator.share({files: [file], title: "Laudo SPDA (Word) — " + S.cfg.cliente});
      return;
    } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  a.click();
}

async function render() {
  const wrap = $("#app-wrap");
  const B = getB();
  const c = S.cfg;
  const rep = S.reposicao || {};

  if (view === "cfg") {
    wrap.innerHTML = renderConfigView();
    updateSaveIndicator();
    return;
  }
  if (view && view !== "") {
    wrap.innerHTML = renderBlockDetailView(view);
    hydrateThumbs();
    updateSaveIndicator();
    return;
  }

  const filteredByTeam = filterDupla ? B.filter(b => b[2] == filterDupla) : B;
  let doneBlocks = 0, totalDescidas = 0, measuredDescidas = 0, totalAlertas = 0;

  const statsMap = {};
  for (const b of B) {
    const st = blockStats(b);
    statsMap[b[0]] = st;
    if (!filterDupla || b[2] == filterDupla) {
      if (st.isCompleted) doneBlocks++;
      totalDescidas += st.totR;
      measuredDescidas += st.medR;
      totalAlertas += st.totNC;
    }
  }

  const libDone = LIB_CHK.filter((_, i) => S.lib && S.lib["k" + i]).length;
  const pctBlocks = filteredByTeam.length ? Math.round((doneBlocks / filteredByTeam.length) * 100) : 0;
  const pctMeasured = totalDescidas ? Math.round((measuredDescidas / totalDescidas) * 100) : 0;

  const nextBlock = filteredByTeam.find(b => !statsMap[b[0]].isCompleted);
  const nextSt = nextBlock ? statsMap[nextBlock[0]] : null;

  const phAll = await pall();
  const activeTeam = filterDupla || c.equipeAtiva || 1;

  let tabContent = "";

  if (activeTab === "blocos") {
    const rowsHtml = filteredByTeam.filter(b => {
      const st = statsMap[b[0]];
      if (filterMode === "OPEN" && st.isCompleted) return false;
      if (filterMode === "NC" && st.totNC === 0) return false;
      if (searchQ && !b[1].toLowerCase().includes(searchQ.toLowerCase()) && !b[0].toLowerCase().includes(searchQ.toLowerCase())) return false;
      return true;
    }).map(b => {
      const st = statsMap[b[0]];
      return `
        <tr onclick="go('${esc(b[0])}')" style="cursor:pointer">
          <td class="n">${esc(b[0])}</td>

          </td>
          <td><span class="tag ${st.status}">${st.status === "NC" ? `${st.totNC} NC` : st.status}</span></td>
          <td class="no-strike" style="text-align:right;white-space:nowrap" onclick="event.stopPropagation()">
            <button class="b" style="padding:5px 8px;font-size:12px" title="Editar nome do lugar" onclick="openBlockModal('${esc(b[0])}')">✎</button>

          </td>

        <div class="sub">${teamLabel(b[2])} · ${st.totR ? `${st.medR}/${st.totR} descidas medidas` : "Somente BEP"} · ${st.totPh} foto(s) HD com carimbo</div>
      </div>
    </header>

    <div class="card">
      <h3>Dados de Execução da Ficha</h3>
      <div class="g2">
        <div>
          <label>Data deste Bloco</label>
          <input type="date" value="${esc(f.data || S.cfg.data)}" oninput="setSilent('${esc(blockId)}','data',this.value)">
        </div>
        <div>
          <label>Responsável pelo Levantamento</label>
          <input placeholder="Nome do operador" value="${esc(f.respBloco || "")}" oninput="setSilent('${esc(blockId)}','respBloco',this.value)">
        </div>
      </div>
      <div class="g2">
        <div>
          <label>Início <a href="javascript:void(0)" onclick="setNow('${esc(blockId)}','hi')" style="float:right;color:var(--fg)">[Agora]</a></label>
          <input type="time" value="${esc(f.hi)}" oninput="setSilent('${esc(blockId)}','hi',this.value)">
        </div>
        <div>
          <label>Fim <a href="javascript:void(0)" onclick="setNow('${esc(blockId)}','hf')" style="float:right;color:var(--fg)">[Agora]</a></label>
          <input type="time" value="${esc(f.hf)}" oninput="setSilent('${esc(blockId)}','hf',this.value)">
        </div>
      </div>
      <div class="g2" style="margin-top:4px">
        <div>
          <label>Condição do Solo</label>
          ${seg(blockId, "solo", f.solo, [["Seco", "Seco"], ["Úmido", "Úmido"]])}
        </div>
        <div>
          <label>Clima</label>
          ${seg(blockId, "clima", f.clima || "", [["Sol", "Sol"], ["Nublado", "Nublado"]])}
        </div>
      </div>
      <label>Observações do Local / Bloco</label>
      <input placeholder="Observação geral deste local..." value="${esc(f.obs || "")}" oninput="setSilent('${esc(blockId)}','obs',this.value)">
    </div>`;

  if (!o.includes("only")) {
    h += `
      <div class="card">
        <h3>Fotos Obrigatórias da Rotina (Fachada e Telhado)</h3>
        <div class="g2">
          <div>
            <label>1. Foto da Fachada (Hora: ${esc(f.fachadaHora || "—")})</label>
            <div class="row">
              <button class="b" onclick="photo('${esc(blockId)}','Fachada',-1,-1,true,'fachada')">📷 Câmera (${(f.fachadaPh || []).length})</button>
              <button class="b" onclick="photo('${esc(blockId)}','Fachada',-1,-1,false,'fachada')">🖼 Galeria</button>
            </div>
            ${renderThumbs(blockId, f.fachadaPh || [], "fachada", 0)}
          </div>
          <div>
            <label>2. Foto do Telhado/Captação (Hora: ${esc(f.telhadoHora || "—")})</label>
            <div class="row">
              <button class="b" onclick="photo('${esc(blockId)}','Telhado',-1,-1,true,'telhado')">📷 Câmera (${(f.telhadoPh || []).length})</button>
              <button class="b" onclick="photo('${esc(blockId)}','Telhado',-1,-1,false,'telhado')">🖼 Galeria</button>
            </div>
            ${renderThumbs(blockId, f.telhadoPh || [], "telhado", 0)}
          </div>
        </div>
      </div>

      <div class="card">
        <h3>A. Checklist Visual (Caderneta de Campo)</h3>
        ${CHK.map(([k, l]) => `
          <div style="margin:8px 0;padding-bottom:8px;border-bottom:1px solid var(--line)">
            <div style="margin-bottom:4px;font-weight:500">${l}</div>
            ${seg(blockId, "chk." + k, f.chk[k] || "", [["Sim", "Sim", "good"], ["Não", "Não", "bad"], ["NA", "N/A"]])}
          </div>`).join("")}
      </div>`;
  }

  if (o.includes("bep") || o.includes("only")) {
    h += `
      <div class="card">
        <h3>BEP (Barramento de Equipotencialização)</h3>
        ${o.includes("only") ? `
          <div style="margin-bottom:8px">
            <div>BEP localizado e acessível?</div>
            ${seg(blockId, "bepAcess", f.bepAcess || "", [["Sim", "Sim", "good"], ["Não", "Não", "bad"]])}
          </div>
          <div style="margin-bottom:8px">
            <div>Corrosão / folga nas conexões?</div>
            ${seg(blockId, "bepCorr", f.bepCorr || "", [["Não", "Não", "good"], ["Sim", "Sim", "bad"]])}
          </div>
          <div style="margin-bottom:8px">
            <div>Reservatório / estrutura metálica ligado ao BEP?</div>
            ${seg(blockId, "bepResLig", f.bepResLig || "", [["Sim", "Sim", "good"], ["Não", "Não", "bad"], ["NA", "N/A"]])}
          </div>
          <div style="margin-bottom:8px">
            <div>Placa "Risco de Choque" no local?</div>
            ${seg(blockId, "bepPlaca", f.bepPlaca || "", [["Sim", "Sim", "good"], ["Não", "Não", "bad"]])}
          </div>
        ` : ""}
        <div style="margin-bottom:4px">Barra de Cu, isoladores e conexões íntegros?</div>
        ${seg(blockId, "bepOk", f.bepOk, [["Sim", "Sim", "good"], ["Não", "Não", "bad"]])}
        <div class="g2">
          <div>
            <label>Continuidade BEP → malha (Ω)</label>
            <input inputmode="decimal" placeholder="0,00" value="${esc(f.bepC)}" oninput="setSilent('${esc(blockId)}','bepC',this.value)">
          </div>
          <div>
            <label>Terra no BEP (Ω)</label>
            <input inputmode="decimal" placeholder="0,00" value="${esc(f.bepT || "")}" oninput="setSilent('${esc(blockId)}','bepT',this.value)">
          </div>
        </div>
        <div class="g2" style="margin-top:6px">
          <div>
            <label>Hora da Foto do BEP</label>
            <input placeholder="HH:MM:SS" value="${esc(f.bepHora || "")}" oninput="setSilent('${esc(blockId)}','bepHora',this.value)">
          </div>
          <div style="display:flex;align-items:flex-end;gap:6px">
            <button class="b" onclick="photo('${esc(blockId)}','BEP',-1,-1,true,'bep')">📷 Câmera HD (${(f.bepPh || []).length})</button>
            <button class="b" onclick="photo('${esc(blockId)}','BEP',-1,-1,false,'bep')">🖼</button>
          </div>
        </div>
        ${renderThumbs(blockId, f.bepPh || [], "bep", 0)}
      </div>`;
  }

  if (o.includes("dps")) {
    h += `
      <div class="card">
        <h3>DPS no Quadro Geral (QDG)</h3>
        <div class="g2">
          <div>
            <label>Instalado e ligado ao BEP/Terra?</label>
            ${seg(blockId, "dps", f.dps, [["Sim", "Sim", "good"], ["Não", "Não", "bad"]])}
          </div>
          <div>
            <label>Indicador Visual</label>
            ${seg(blockId, "dpsCor", f.dpsCor || "", [["Verde", "Verde", "good"], ["Vermelho", "Vermelho", "bad"]])}
          </div>
        </div>
      </div>`;
  }

  if (f.rows.length || !o.includes("only")) {
    h += `<h3>B. Descidas e Caixas de Inspeção (Sentido Horário)</h3>`;
    f.rows.forEach((r, i) => {
      const j = judge(r);
      const hasNC = j.length || [r.barra, r.eld, r.cx].includes("NC");
      const isOk = !hasNC && (r.cont !== "" || r.terra !== "");
      const cl = hasNC ? "nc" : (isOk ? "ok" : "");
      h += `
        <div id="row-card-${i}" class="card d ${cl}">
          <div class="row">
            <input class="inline-edit" value="${esc(r.p)}" title="Código da descida" oninput="setSilent('${esc(blockId)}','rows.${i}.p',this.value)">
            <input class="grow" style="padding:5px 8px;font-size:13px" placeholder="Referência / Nome (ex.: Fachada N)" value="${esc(r.loc || "")}" oninput="setSilent('${esc(blockId)}','rows.${i}.loc',this.value)">
            <span class="row-badges">${j.map(x => `<span class="tag NC">${esc(x)}</span>`).join("")}</span>
          </div>
          ${[["barra", "Barra + fixação"], ["eld", "Eletroduto + placa"], ["cx", "Caixa + bimetálico"]].map(([k, l]) => `
            <div class="row" style="margin-top:6px">
              <small class="grow" style="font-size:13px">${l}</small>
              ${seg(blockId, `rows.${i}.${k}`, r[k], [["OK", "OK", "good"], ["NC", "NC", "bad"]])}
            </div>`).join("")}
          <div class="g2" style="margin-top:6px">
            <div>
              <label>Continuidade (Ω) ≤ ${S.cfg.limC}</label>
              <input inputmode="decimal" placeholder="Ex: 0.12" value="${esc(r.cont)}" oninput="setSilent('${esc(blockId)}','rows.${i}.cont',this.value)">
            </div>
            <div>
              <label>Terra (Ω) ≤ ${S.cfg.limT}</label>
              <input inputmode="decimal" placeholder="Ex: 4.5" value="${esc(r.terra)}" oninput="setSilent('${esc(blockId)}','rows.${i}.terra',this.value)">
            </div>
          </div>
          <div class="g2" style="margin-top:6px">
            <div>
              <label>Hora da Foto (automática ao fotografar)</label>
              <input placeholder="HH:MM:SS" value="${esc(r.horaFoto || "")}" oninput="setSilent('${esc(blockId)}','rows.${i}.horaFoto',this.value)">
            </div>
            <div style="display:flex;align-items:flex-end;gap:6px">
              <label style="display:inline-flex;align-items:center;gap:6px;margin:0;padding:8px 0;text-transform:none;font-size:13px;color:var(--fg)">
                <input type="checkbox" ${r.fotoVisorOk ? "checked" : ""} onchange="set('${esc(blockId)}','rows.${i}.fotoVisorOk',this.checked?1:0,0)"> Foto Visor OK
              </label>
            </div>
          </div>
          <div class="row" style="margin-top:8px">
            <button class="b" onclick="photo('${esc(blockId)}','${esc(r.p)}',${i},-1,true)">📷 Foto HD (${(r.ph || []).length})</button>
            <button class="b" onclick="photo('${esc(blockId)}','${esc(r.p)}',${i},-1,false)">🖼</button>
            ${seg(blockId, `rows.${i}.pl`, r.pl, [["Rosa", "Rosa", "pink"], ["Verm", "Verm", "bad"]])}
            <span class="grow"></span>
            <button class="b" style="color:var(--nc)" onclick="if(confirm('Remover ${esc(r.p)}?')){F('${esc(blockId)}').rows.splice(${i},1);saveNow(true);render()}">✕</button>
          </div>
          ${renderThumbs(blockId, r.ph || [], "row", i)}
        </div>`;
    });
    h += `<button class="b" style="width:100%;margin-bottom:10px" onclick="F('${esc(blockId)}').rows.push(R(F('${esc(blockId)}').rows.length));saveNow(true);render()">+ Adicionar Descida</button>`;
  }

  h += `
    <div class="card">
      <h3>C. Não Conformidades e Reparos Feitos em Campo</h3>
      <label>Reparos feitos em campo (material / local)</label>
      <input placeholder="Ex.: Instalada 1 placa Risco de Choque e trocado 1 conector em D02" value="${esc(f.reparosCampo || "")}" oninput="setSilent('${esc(blockId)}','reparosCampo',this.value)" style="margin-bottom:10px">
      ${f.ncs.map((n, i) => `
        <div class="card d nc">
          <div class="row">
            <b class="grow mono">NC-${String(i + 1).padStart(2, "0")}</b>
            <button class="b" style="color:var(--nc);padding:4px 8px;font-size:12px" onclick="F('${esc(blockId)}').ncs.splice(${i},1);saveNow(true);render()">Excluir</button>
          </div>
          <div class="g2">
            <div>
              <label>Ponto / Descida</label>
              <input placeholder="Ex.: D03, Topo..." value="${esc(n.ponto)}" oninput="setSilent('${esc(blockId)}','ncs.${i}.ponto',this.value)">
            </div>
            <div>
              <label>Código da NC</label>
              <select onchange="set('${esc(blockId)}','ncs.${i}.cod',this.value);if(COD[this.value])set('${esc(blockId)}','ncs.${i}.sev',COD[this.value][1],1)">
                <option value="">— Selecione —</option>
                ${Object.entries(COD).map(([k, v]) => `<option value="${k}" ${n.cod == k ? "selected" : ""}>${k} - ${v[0]}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="g2">
            <div>
              <label>Severidade</label>
              ${seg(blockId, `ncs.${i}.sev`, n.sev, [["A", "A (Crítica)", "bad"], ["B", "B (Média)"], ["C", "C (Leve)"]])}
            </div>
            <div>
              <label>Hora da Foto</label>
              <input placeholder="HH:MM:SS" value="${esc(n.horaFoto || "")}" oninput="setSilent('${esc(blockId)}','ncs.${i}.horaFoto',this.value)">
            </div>
          </div>
          <label>Detalhe / Reparo Feito</label>
          <textarea rows="2" placeholder="Descreva o problema e o reparo..." oninput="setSilent('${esc(blockId)}','ncs.${i}.det',this.value)">${esc(n.det)}</textarea>
          <div class="row" style="margin-top:6px">
            <button class="b" onclick="photo('${esc(blockId)}','NC-${i + 1}',-1,${i},true)">📷 Câmera HD (${(n.ph || []).length})</button>
            <button class="b" onclick="photo('${esc(blockId)}','NC-${i + 1}',-1,${i},false)">🖼 Galeria</button>
          </div>
          ${renderThumbs(blockId, n.ph || [], "nc", i)}
        </div>`).join("")}
      <button class="b" style="width:100%" onclick="F('${esc(blockId)}').ncs.push({ponto:'',cod:'',sev:'',horaFoto:'',det:'',ph:[]});saveNow(true);render()">+ Adicionar Não Conformidade</button>
    </div>

    <div class="card">
      <h3>D. Fechamento do Bloco</h3>
      <div class="g2" style="margin-bottom:8px">
        <div>
          <label>Hora de Conclusão <a href="javascript:void(0)" onclick="setNow('${esc(blockId)}','horaConc')" style="float:right;color:var(--fg)">[Agora]</a></label>
          <input type="time" value="${esc(f.horaConc || "")}" oninput="setSilent('${esc(blockId)}','horaConc',this.value)">
        </div>
        <div>
          <label>Visto / Conferente</label>
          <input placeholder="Iniciais / Visto" value="${esc(f.visto || "")}" oninput="setSilent('${esc(blockId)}','visto',this.value)">
        </div>
      </div>
      ${[["vis", "Inspeção visual concluída"], ["med", "Medições concluídas"], ["foto", "Fotos em HD c/ carimbo registradas"], ["pl", "Pintado na planta A3 (Rosa = OK / Vermelho = NC)"]].map(([k, l]) => `
        <label style="display:flex;gap:10px;align-items:center;font-size:14px;color:var(--fg);padding:5px 0;text-transform:none">
          <input type="checkbox" ${f.done[k] ? "checked" : ""} onchange="F('${esc(blockId)}').done.${k}=this.checked?1:0;saveNow(true);render()">
          ${l}
        </label>`).join("")}
      <button class="big" style="margin-top:10px" onclick="go('')">✓ Salvar e Voltar ao Painel</button>
    </div>`;

  return h;
}

        <div>
          <label>Aparelho Continuidade (Modelo/Série)</label>

          <input value="${esc(c.local || "")}" oninput="setCfgSilent('local',this.value)">
        </div>
        <div>

          <input inputmode="decimal" value="${c.limC}" oninput="setCfgSilent('limC',num(this.value)||0.2)">
        </div>
        <div>
          <label>Limite Terra Ideal / Solo Seco (Ω)</label>
          <input inputmode="decimal" value="${c.limT}" oninput="setCfgSilent('limT',num(this.value)||10)">

    <div class="card">
      <h3>Qualidade da Foto e Carimbo Automático</h3>

      </select>
      <label style="display:flex;gap:10px;align-items:center;font-size:14px;color:var(--fg);margin-top:10px;text-transform:none">
        <input type="checkbox" ${c.carimboOn !== 0 ? "checked" : ""} onchange="setCfgSilent('carimboOn',this.checked?1:0)">

    <div class="card">

}

function openBlockModal(editId) {
  const B = getB();
  const ex = editId ? B.find(x => x[0] === editId) : null;
  const id = ex ? ex[0] : "";
  const nome = ex ? ex[1] : "";
  const dupla = ex ? ex[2] : (filterDupla || S.cfg.equipeAtiva || 1);
  const opts = ex ? (ex[3] || "") : "";
  const hasBep = opts.includes("bep");
  const hasDps = opts.includes("dps");
  const isOnly = opts.includes("only");
  const qtdDesc = editId && S.f[editId] ? S.f[editId].rows.length : 10;

  $("#modal-root").innerHTML = `
    <div class="modal-bg" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <h3 style="margin-top:0">${ex ? "Editar Local / Bloco" : "Novo Local / Bloco"}</h3>
        <div class="g2">
          <div>
            <label>Sigla / Código</label>
            <input id="mb-id" value="${esc(id)}" placeholder="Ex.: M, Galp1" ${ex ? "readonly style='opacity:.7'" : ""}>
          </div>
          <div>
            <label>Equipe Responsável</label>
            <select id="mb-dupla">
              <option value="1" ${dupla == 1 ? "selected" : ""}>Equipe A (Dupla 1)</option>
              <option value="2" ${dupla == 2 ? "selected" : ""}>Equipe B (Dupla 2)</option>
            </select>
          </div>
        </div>
        <label>Nome do Lugar / Edifício (vai no Laudo e no carimbo da foto)</label>
        <input id="mb-nome" value="${esc(nome)}" placeholder="Ex.: Bloco A, Subestação...">
        ${!ex ? `
          <label>Quantidade inicial de descidas</label>
          <input id="mb-qtd" type="number" min="0" max="60" value="${qtdDesc}">
        ` : ""}
        <div style="margin-top:10px">
          <label>Configuração do Local</label>
          <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);text-transform:none">
            <input type="checkbox" id="mb-bep" ${hasBep ? "checked" : ""}> Possui BEP (Barramento de Equipotencialização)
          </label>
          <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);text-transform:none">
            <input type="checkbox" id="mb-dps" ${hasDps ? "checked" : ""}> Verificar DPS no QDG
          </label>
          <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);text-transform:none">
            <input type="checkbox" id="mb-only" ${isOnly ? "checked" : ""}> Somente BEP / Aterramento (sem descidas)
          </label>
        </div>
        <div class="row" style="margin-top:14px">
          ${ex ? `<button class="b" style="color:var(--nc)" onclick="deleteBlock('${esc(id)}')">🗑 Excluir</button>` : ""}
          <span class="grow"></span>
          <button class="b" onclick="closeModal()">Cancelar</button>
          <button class="b" style="background:var(--fg);color:var(--bg)" onclick="saveBlockModal('${esc(editId || "")}')">Salvar</button>
        </div>
      </div>
    </div>`;
}

function saveBlockModal(editId) {
  const B = getB();
  let id = ($("#mb-id").value || "").trim().replace(/[^a-zA-Z0-9_-]/g, "");
  const nome = ($("#mb-nome").value || "").trim();
  const dupla = parseInt($("#mb-dupla").value) || 1;
  const flags = [];
  if ($("#mb-bep").checked) flags.push("bep");
  if ($("#mb-dps").checked) flags.push("dps");
  if ($("#mb-only").checked) flags.push("only");
  const optStr = flags.join(" ");

  if (!nome) { alert("Informe o nome do local/bloco."); return; }
  if (!id) id = nome.slice(0, 4).toUpperCase().replace(/\s+/g, "") + Math.floor(Math.random() * 90 + 10);

  if (editId) {
    const idx = B.findIndex(x => x[0] === editId);
    if (idx >= 0) {
      B[idx] = [editId, nome, dupla, optStr, B[idx][4] ?? 10];
      if (S.f[editId]) S.f[editId].dupla = dupla;
    }
  } else {
    if (B.some(x => x[0] === id)) { alert("Já existe um local com a sigla " + id + "."); return; }
    const qtd = Math.max(0, Math.min(60, parseInt($("#mb-qtd")?.value ?? 10)));
    B.push([id, nome, dupla, optStr, qtd]);
    const f = F(id);
    f.rows = optStr.includes("only") ? [] : Array.from({length: qtd}, (_, i) => R(i));
  }
  saveNow(true);
  closeModal();
  render();
}

function deleteBlock(id) {
  if (!confirm("Remover este local da lista?")) return;
  S.blocos = getB().filter(x => x[0] !== id);
  delete S.f[id];
  saveNow(true);
  closeModal();
  if (view === id) view = "";
  render();
}

function setNow(id, field) {
  const now = new Date().toTimeString().slice(0, 5);
  set(id, field, now, 1);
}

function snap() {
  return JSON.stringify({
    gerado: new Date().toISOString(),
    cfg: {...S.cfg, tok: undefined},
    reposicao: S.reposicao,
    blocos: getB(),
    lib: S.lib,
    f: S.f
  }, null, 2);
}

async function downloadAllPhotosHD() {
  const ks = await pkeys();
  if (!ks.length) { alert("Nenhuma foto salva no aparelho ainda."); return; }
  for (const k of ks) {
    const p = await pget(k);
    if (!p || !p.b) continue;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(p.b);
    a.download = k;
    a.click();
    await new Promise(r => setTimeout(r, 220));
  }
}

async function sendToTeamDrive(teamNum = 1) {
  const teamKey = teamNum == 2 ? "EquipeB" : "EquipeA";
  const folderUrl = getDriveUrl(teamNum);
  const pdfFile = await buildPDFFile(teamNum);
  const aiFile = buildAIStructuredFile(teamNum);
  const wordFile = await buildWordDocxFile(teamNum);
  const jsonFile = new File([snap()], `${teamKey}_spda_dados.json`, {type: "application/json"});
  const files = [pdfFile, aiFile, wordFile, jsonFile];
  const ks = await pkeys();
  const B = getB();
  for (const k of ks) {
    const p = await pget(k);
    if (!p || !p.b) continue;
    const blk = B.find(x => x[0] === p.id);
    if (blk && blk[2] != teamNum) continue;
    files.push(new File([p.b], k, {type: "image/jpeg"}));
  }

  if (navigator.canShare && navigator.canShare({files})) {
    try {
      await navigator.share({
        files,
        title: `SPDA ${teamLabel(teamNum)} — ${S.cfg.cliente}`,
        text: `Pasta Drive ${teamLabel(teamNum)}: ${folderUrl}`
      });
      for (const k of ks) {
        const p = await pget(k);
        const blk = B.find(x => x[0] === p.id);
        if (blk && blk[2] != teamNum) continue;
        p.s = 1;
        await pset(k, p);
      }
      render();
      return;
    } catch (e) { if (e.name === "AbortError") return; }
  }

  const a = document.createElement("a");
  a.href = URL.createObjectURL(pdfFile);
  a.download = pdfFile.name;
  a.click();
  setTimeout(() => window.open(folderUrl, "_blank"), 400);
}

function downloadJSONOnly() {
  const blob = new Blob([snap()], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `spda_dados_${(S.cfg.cliente || "campo").replace(/\s+/g, "_")}.json`;
  a.click();
}

function importJSONPrompt() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".json,application/json";
  inp.onchange = async () => {
    if (!inp.files || !inp.files[0]) return;
    try {
      const txt = await inp.files[0].text();
      const data = JSON.parse(txt);
      if (data.cfg) S.cfg = {...S.cfg, ...data.cfg};
      if (data.reposicao) S.reposicao = {...S.reposicao, ...data.reposicao};
      if (Array.isArray(data.blocos)) S.blocos = data.blocos;
      if (data.lib) S.lib = data.lib;
      if (data.f) S.f = data.f;
      saveNow(true);
      alert("Dados importados com sucesso!");
      go("");
    } catch (e) {
      alert("Arquivo JSON inválido.");
    }
  };
  inp.click();
}

function restoreSnapshot(idx) {
  const snaps = getSnapshots();
  if (!snaps[idx]) return;
  if (!confirm(`Restaurar os dados do snapshot automático salvo às ${snaps[idx].h}?`)) return;
  try {
    const parsed = JSON.parse(snaps[idx].data);
    S = parsed;
    saveNow(false);
    alert("Snapshot restaurado!");
    go("");
  } catch (e) {
    alert("Erro ao restaurar snapshot.");
  }
}

function resetDefaultBlocks() {
  if (!confirm("Restaurar a lista de blocos padrão (Bloco A até BEP Reservatório)?")) return;
  S.blocos = DEFAULT_B.map(x => [...x]);
  saveNow(true);
  render();
}

async function clearAllData() {
  if (!confirm("ATENÇÃO: Isso apagará todas as medições e fotos salvas neste aparelho. Confirmar?")) return;
  S.f = {};
  S.lib = {};
  S.reposicao = { placasQtd: "", placasLocais: "", conectoresQtd: "", conectoresLocais: "", outros: "", anotacoesLivres: "" };
  const ks = await pkeys();
  for (const k of ks) await pdel(k);
  photoURLCache = {};
  localStorage.removeItem(LS_STATE_KEY);
  localStorage.removeItem(LS_SNAPS_KEY);
  saveNow(false);
  go("");
}

async function printReport(teamFilter = 0) {
  const allB = getB(), c = S.cfg;
  const B = teamFilter ? allB.filter(b => b[2] == teamFilter) : allB;
  let html = `
    <div style="background:#1F3A5F;color:#fff;padding:12px 16px;margin-bottom:14px">
      <div style="font-size:12px;opacity:.9">${esc(c.empresa)}</div>
      <h2 style="margin:4px 0">LAUDO TÉCNICO DE INSPEÇÃO E MEDIÇÃO DE SPDA — ABNT NBR 5419:2015</h2>
      <div style="font-size:12px">
        <b>Cliente:</b> ${esc(c.cliente)} (${esc(c.local)}) |
        <b>Data:</b> ${esc(c.data)} |
        <b>Limites:</b> Cont. <= ${c.limC} Ω / Terra <= ${c.limT} Ω
      </div>
    </div>`;

  for (const b of B) {
    const bs = blockStats(b);
    const f = bs.f;
    if (c.soPreenchidos && !bs.isStarted && !bs.totNC) continue;
    const blockNCs = collectAllBlockNCs(b);
    const photos = [];
    for (const k of (f.fachadaPh || [])) photos.push({k, cap: `${b[1]} — Fachada (${f.fachadaHora || "-"})`});
    for (const k of (f.telhadoPh || [])) photos.push({k, cap: `${b[1]} — Telhado (${f.telhadoHora || "-"})`});
    for (const k of (f.bepPh || [])) photos.push({k, cap: `${b[1]} — BEP (${f.bepHora || "-"})`});
    for (const r of (f.rows || [])) for (const k of (r.ph || [])) photos.push({k, cap: `${b[1]} — ${r.p} (${r.horaFoto || "-"})`});
    for (let i = 0; i < (f.ncs || []).length; i++) for (const k of (f.ncs[i].ph || [])) photos.push({k, cap: `${b[1]} — NC-${i + 1}`});

    const rowsToRender = c.soPreenchidos
      ? f.rows.filter(r => r.cont !== "" || r.terra !== "" || r.barra || r.eld || r.cx || (r.ph && r.ph.length))
      : f.rows;

    html += `
      <div class="p-card">
        <h3 style="margin:0 0 6px;color:#1F3A5F">${esc(b[1])} [${esc(b[0])}] — ${teamLabel(b[2])}</h3>
        <div><b>Horário:</b> ${esc(f.hi || "-")} às ${esc(f.hf || "-")} | <b>Solo:</b> ${esc(f.solo || "-")} | <b>Clima:</b> ${esc(f.clima || "-")}</div>
        ${rowsToRender.length ? `
          <table class="p-tbl">
            <thead><tr><th>Ponto / Ref.</th><th>Barra</th><th>Eletrod.</th><th>Caixa</th><th>Cont. (Ω)</th><th>Terra (Ω)</th><th>Foto(Hora)</th><th>Planta</th><th>Diagnóstico</th></tr></thead>
            <tbody>
              ${rowsToRender.map(r => {
                const diag = rowDiagnosis(r);
                return `<tr>
                  <td><b>${esc(r.p)}</b> ${r.loc ? `(${esc(r.loc)})` : ""}</td>
                  <td>${esc(r.barra || "-")}</td>
                  <td>${esc(r.eld || "-")}</td>
                  <td>${esc(r.cx || "-")}</td>
                  <td>${esc(r.cont || "-")}</td>
                  <td>${esc(r.terra || "-")}</td>
                  <td>${esc(r.horaFoto || "-")}</td>
                  <td>${esc(r.pl || "-")}</td>
                  <td style="font-weight:bold;color:${diag.ok ? "#15803D" : "#B91C1C"}">${esc(diag.ok ? diag.short : `${diag.short}: ${diag.detail}`)}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>` : ""}
        ${blockNCs.length ? `
          <div style="margin-top:8px"><b>Não Conformidades:</b>
            <table class="p-tbl">
              <thead><tr><th>Item</th><th>Ponto</th><th>Sev.</th><th>Desvio</th><th>Recomendação Técnica</th></tr></thead>
              <tbody>${blockNCs.map(n => `<tr><td><b>${esc(n.code)}</b></td><td>${esc(n.ponto)}</td><td><b>${esc(n.sev)}</b></td><td>${esc(n.titulo)}</td><td>${esc(n.detalhe)}</td></tr>`).join("")}</tbody>
            </table>
          </div>` : ""}
        ${photos.length ? `<div class="p-grid-ph">${photos.map(p => `<div class="p-ph"><img data-ph="${esc(p.k)}"><div style="font-size:11px;font-weight:600;margin-top:4px">${esc(p.cap)}</div></div>`).join("")}</div>` : ""}
      </div>`;
  }

  $("#print-area").innerHTML = html;
  await hydrateThumbs();
  setTimeout(() => window.print(), 250);
}
