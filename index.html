<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPDA Campo — Inspeção, Progresso e Laudo Word/PDF</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#1c2421">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{
  --bg:#f5f6f4;--panel:#ffffff;--fg:#1c2421;--muted:#5f6b66;--line:#d6dbd8;
  --accent:#c98a00;--ok:#2f7d4f;--warn:#b5561c;--nc:#d13b3b;--info:#2b5f8a;--chip:#eef0ee;
  --wa:#1fa855;--drv:#1a73e8;--word:#185abd;--pink:#d66094;
  --f-disp:"Barlow Condensed",Impact,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131816;--panel:#1b2220;--fg:#e4e9e6;--muted:#97a39e;--line:#2d3633;
    --accent:#f0b429;--ok:#5cc28a;--warn:#f08a4b;--nc:#f26464;--info:#6fa8d6;--chip:#232b29;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
}
.wrap{
  max-width:1080px;margin:0 auto;padding-block:14px 40px;
  padding-left:max(12px,env(safe-area-inset-left,0px));
  padding-right:max(12px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;
}
header.top-stamp{
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;
  border-bottom:3px solid var(--fg);padding-bottom:10px;
}
h1{font:700 1.95rem/1 var(--f-disp);letter-spacing:.02em;margin:0;text-transform:uppercase}
.sub{color:var(--muted);font-size:.86rem;margin-top:4px}
.meta{font:500 .76rem/1.45 var(--f-mono);color:var(--muted);text-align:right}
.prog{display:flex;flex-direction:column;gap:5px;background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.bar{height:10px;background:var(--chip);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.bar i.ok-bar{background:var(--ok)}
.prog .lbl{display:flex;justify-content:space-between;font:500 .8rem var(--f-mono);color:var(--muted)}
.prog .lbl b{color:var(--fg)}
.next{
  background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);
  padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;
}
.next:active{opacity:.85}
.next .k{font:600 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.next .v{font-weight:600;margin-top:2px;font-size:.94rem}
nav.tabs{display:flex;flex-wrap:wrap;gap:5px}
nav.tabs button{
  font:600 .83rem var(--f-body);background:var(--chip);color:var(--fg);
  border:1px solid var(--line);padding:8px 11px;cursor:pointer;flex:1 1 auto;text-align:center;
}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
section.box{background:var(--panel);border:1px solid var(--line)}
section.box h2{
  font:700 1.15rem var(--f-disp);text-transform:uppercase;letter-spacing:.03em;
  margin:0;padding:10px 14px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
}
.filt{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.filt button{
  font:600 .74rem var(--f-mono);background:none;color:var(--muted);
  border:1px solid var(--line);padding:5px 9px;cursor:pointer;
}
.filt button[aria-pressed="true"]{color:var(--bg);background:var(--fg);border-color:var(--fg)}
.scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
table.tbl th,table.tbl td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl th{
  font:600 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);background:var(--chip);white-space:nowrap;
}
td.n{font:600 .84rem var(--f-mono);white-space:nowrap}
code,.mono{font-family:var(--f-mono);font-size:.8rem}
tr.done td:not(.c):not(.no-strike){opacity:.58}
td.c{width:34px;text-align:center}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok);cursor:pointer}
.tag{
  display:inline-block;font:600 .68rem var(--f-mono);padding:2px 6px;
  border:1px solid currentColor;white-space:nowrap;text-transform:uppercase;
}
.tag.CONCLUIDO{color:var(--ok)}
.tag.ANDAMENTO{color:var(--info)}
.tag.NC{color:var(--nc)}
.tag.PENDENTE{color:var(--muted)}
.note{padding:10px 14px;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
h3{margin:2px 0 10px;font:700 1rem var(--f-disp);color:var(--fg);text-transform:uppercase;letter-spacing:.04em}
button.b,.seg button{
  border:1px solid var(--line);background:var(--chip);color:var(--fg);
  padding:8px 11px;font:600 .82rem var(--f-body);cursor:pointer;
}
button.b:active,.seg button:active{transform:scale(.98)}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg button.on.bad{background:var(--nc);color:#fff;border-color:var(--nc)}
.seg button.on.good{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg button.on.pink{background:var(--pink);color:#fff;border-color:var(--pink)}
input:not([type=checkbox]),select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);font:15px var(--f-body);
}
label{font:600 .73rem var(--f-mono);color:var(--muted);display:block;margin:6px 0 3px;text-transform:uppercase}
.d{border-left:5px solid var(--line)}
.d.ok{border-left-color:var(--ok)}
.d.nc{border-left-color:var(--nc)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
small{color:var(--muted);font-size:12px}
.big{
  width:100%;padding:12px 14px;font:700 .95rem var(--f-disp);letter-spacing:.03em;text-transform:uppercase;
  border:1px solid var(--fg);background:var(--fg);color:var(--bg);margin:4px 0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
}
.big.word{background:var(--word);border-color:var(--word);color:#fff}
.big.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.big.drv{background:var(--drv);border-color:var(--drv);color:#fff}
.big.out{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.th{
  position:relative;width:82px;height:82px;overflow:hidden;
  border:1px solid var(--line);background:#000;flex-shrink:0;
}
.th img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.th button{
  position:absolute;top:2px;right:2px;width:22px;height:22px;
  border:0;background:rgba(209,59,59,.92);color:#fff;font-size:12px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
}
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:14px;
}
.modal{
  background:var(--panel);color:var(--fg);max-width:520px;width:100%;
  max-height:92vh;overflow-y:auto;padding:16px;border:2px solid var(--fg);
}
.inline-edit{
  border:1px dashed var(--line);padding:4px 8px;font:600 .9rem var(--f-mono);
  width:auto;min-width:85px;max-width:170px;background:transparent;
}
.chk-pill{
  display:inline-flex;align-items:center;gap:3px;font:500 .72rem var(--f-mono);
  padding:2px 5px;border:1px solid var(--line);background:var(--chip);cursor:pointer;margin-right:3px;
}
.chk-pill.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.foot{font:.76rem var(--f-mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
/* Print / PDF A4 */
#print-area{display:none}
@media print{
  .wrap,.modal-bg{display:none!important}
  body{background:#fff!important;color:#000!important;padding:0!important;font-size:11.5px}
  #print-area{display:block!important;padding:8mm}
  .p-card{border:1px solid #888;padding:10px;margin-bottom:14px;page-break-inside:avoid}
  .p-tbl{width:100%;border-collapse:collapse;margin:6px 0;font-size:11px}
  .p-tbl th,.p-tbl td{border:1px solid #777;padding:5px 6px;text-align:left}
  .p-tbl th{background:#1F3A5F;color:#fff}
  .p-grid-ph{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
  .p-ph{border:1px solid #999;padding:6px;text-align:center;page-break-inside:avoid;background:#fafafa}
  .p-ph img{max-width:100%;height:260px;object-fit:contain}
}
</style>

<body>
<div class="wrap" id="app-wrap"></div>
<div id="modal-root"></div>
<div id="print-area"></div>

<script>
const DRIVE_FOLDERS = {
  1: {
    label: "Equipe A (Dupla 1)",
    short: "EquipeA",
    id: "1Yb-zWeo4lCsbByDpDlL0YMxbF3GlqHqA",
    url: "https://drive.google.com/drive/folders/1Yb-zWeo4lCsbByDpDlL0YMxbF3GlqHqA?usp=drive_link"
  },
  2: {
    label: "Equipe B (Dupla 2)",
    short: "EquipeB",
    id: "1HgzIPxKpqCl9-1c6H2LZIW46egbPU75r",
    url: "https://drive.google.com/drive/folders/1HgzIPxKpqCl9-1c6H2LZIW46egbPU75r?usp=drive_link"
  }
};

const DEFAULT_B = [
  ["A","Bloco A",1,""],
  ["B","Bloco B",1,""],
  ["D","Bloco D",1,""],
  ["E","Bloco E",2,""],
  ["G","Bloco G",2,""],
  ["H","Bloco H",2,""],
  ["I","Bloco I",1,""],
  ["J","Bloco J",1,""],
  ["K","Bloco K",2,""],
  ["L","Bloco L",2,""],
  ["N","Bloco N (+BEP)",2,"bep"],
  ["Q","Quadra Coberta (+BEP)",1,"bep"],
  ["Bi","Biblioteca",2,""],
  ["P","Portaria (+BEP Principal)",1,"bep dps"],
  ["R","BEP Reservatório",1,"only"]
];

const COD = {
  C1:["Continuidade alta ou aberta (acima de 0,2 Ω)","A","Refazer conexão elétrica ou substituir trecho/conector oxidado para restabelecer continuidade ≤ 0,2 Ω (NBR 5419-3)."],
  C2:["Falta conector bimetálico na transição Cu/Al","B","Instalar conector bimetálico apropriado na transição cobre/alumínio para evitar par galvânico."],
  C3:["Conector frouxo ou oxidado na descida/malha","B","Limpar oxidação, aplicar pasta antioxidante e reapertar conector mecânico/exotérmico."],
  C4:["Caixa de inspeção sem tampa ou quebrada","B","Substituir/recompor caixa de inspeção de solo e tampa identificadora."],
  C5:["Falta placa de advertência 'Risco de Choque'","C","Fixar placa de sinalização e advertência no pé da descida conforme NBR 5419-3."],
  C6:["Falta eletroduto de proteção PVC 1\" no pé da descida","C","Instalar eletroduto de PVC rígido nos primeiros metros acima do nível do solo para proteção mecânica."],
  C7:["Barra chata de alumínio amassada ou solta","B","Realinhar e refixar barra de descida com isoladores/abraçadeiras a cada 1,0 m."],
  C8:["Cordoalha do subsistema de captação solta ou suporte quebrado","A","Substituir suporte guia/castanha danificado e retensionar cordoalha de cobre 50 mm²."],
  C9:["Massa metálica na cobertura sem equipotencialização","B","Interligar estrutura/massa metálica ao subsistema de captação ou BEP mais próximo."],
  C10:["Resistência de aterramento acima do limite (> 10 Ω) ou sem haste","A","Complementar malha de aterramento com novas hastes Copperweld interligadas e tratadas até atingir R ≤ 10 Ω."],
  C11:["Outra não conformidade de campo","C","Executar adequação técnica conforme diretrizes da ABNT NBR 5419:2015."]
};

const CHK = [
  ["cap","Captação (cordoalha Cu 50 mm² e suportes) íntegra?"],
  ["top","Conexão de topo Cu/Al firme, sem corrosão?"],
  ["desc","Descidas retas e fixadas a cada 1 m?"],
  ["prot","Eletroduto PVC e placa no pé da descida?"],
  ["mass","Massas metálicas aterradas?"]
];

const LIB_CHK = [
  "Todos os blocos da Equipe A (Dupla 1) inspecionados e medidos",
  "Todos os blocos da Equipe B (Dupla 2) inspecionados e medidos",
  "Continuidade elétrica das descidas conferida (critério ≤ 0,2 Ω — NBR 5419-3)",
  "Resistência de aterramento medida nas caixas/BEP (critério ≤ 10 Ω)",
  "BEPs (Bloco N, Quadra, Portaria e Reservatório) verificados e fotografados",
  "DPS do QDG da Portaria verificado",
  "Todas as fotos em HD com carimbo (Local -- Ponto + Data/Hora) conferidas",
  "Pontos conformes (Rosa) e não conformes (Vermelho) pintados na planta A3",
  "Não conformidades (NC) críticas classificadas com severidade A/B/C",
  "Laudo Word (.docx) gerado e enviado para o Google Drive / WhatsApp"
];

let S = {
  cfg: {
    empresa: "TH ELÉTRICA — ENGENHARIA E LAUDOS TÉCNICOS",
    cliente: "Amigos do Bem",
    local: "Inajá - PE",
    proposta: "NBR 5419:2015",
    data: new Date().toISOString().slice(0,10),
    equipeAtiva: 1,
    driveA: DRIVE_FOLDERS[1].url,
    driveB: DRIVE_FOLDERS[2].url,
    resFoto: 2560,
    carimboOn: 1,
    soPreenchidos: 1, // no laudo detalhado mostra só os blocos inspecionados ou todos
    resp: "",
    crea: "",
    art: "",
    limC: 0.2,
    limT: 10,
    url: "",
    tok: "",
    eq: "",
    ap: ""
  },
  blocos: null,
  lib: {},
  f: {}
};

let db, view = "", activeTab = "blocos", searchQ = "", filterMode = "ALL", filterDupla = 0, photoURLCache = {};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function teamLabel(d) {
  return d == 2 ? "Equipe B (Dupla 2)" : "Equipe A (Dupla 1)";
}

function getDriveUrl(teamNum) {
  if (teamNum == 2) return S.cfg.driveB || DRIVE_FOLDERS[2].url;
  return S.cfg.driveA || DRIVE_FOLDERS[1].url;
}

function getB() {
  if (!Array.isArray(S.blocos) || !S.blocos.length) {
    S.blocos = DEFAULT_B.map(x => [...x]);
  }
  return S.blocos;
}

function idb() {
  return new Promise(r => {
    const q = indexedDB.open("spda", 1);
    q.onupgradeneeded = () => {
      if (!q.result.objectStoreNames.contains("kv")) q.result.createObjectStore("kv");
      if (!q.result.objectStoreNames.contains("ph")) q.result.createObjectStore("ph");
    };
    q.onsuccess = () => r(q.result);
  });
}

const tx = (st, m, f) => new Promise(r => {
  const t = db.transaction(st, m), o = f(t.objectStore(st));
  t.oncomplete = () => r(o && o.result);
});
const kget = k => tx("kv", "readonly", s => s.get(k));
const kset = (k, v) => tx("kv", "readwrite", s => s.put(v, k));
const pall = () => tx("ph", "readonly", s => s.getAll());
const pkeys = () => tx("ph", "readonly", s => s.getAllKeys());
const pset = (k, v) => tx("ph", "readwrite", s => s.put(v, k));
const pget = k => tx("ph", "readonly", s => s.get(k));
const pdel = k => tx("ph", "readwrite", s => s.delete(k));

let tm;
function save() {
  clearTimeout(tm);
  tm = setTimeout(() => kset("S", S), 160);
}

const R = i => ({
  p: "D" + String(i + 1).padStart(2, "0"),
  loc: "",
  barra: "",
  eld: "",
  cx: "",
  cont: "",
  terra: "",
  ph: [],
  pl: "",
  obs: ""
});

function F(id) {
  const b = getB().find(x => x[0] == id) || [id, id, 1, ""];
  return S.f[id] ??= (() => {
    const o = b[3] || "";
    return {
      id,
      hi: "",
      hf: "",
      solo: "",
      obs: "",
      dupla: b[2],
      chk: {},
      bepOk: "",
      bepC: "",
      bepT: "",
      bepPh: [],
      dps: "",
      rows: o.includes("only") ? [] : Array.from({length: 8}, (_, i) => R(i)),
      ncs: [],
      done: {vis: 0, med: 0, foto: 0, pl: 0}
    };
  })();
}

const num = v => parseFloat(String(v ?? "").replace(",", "."));

function judge(r) {
  const c = num(r.cont), t = num(r.terra), bad = [];
  if (!isNaN(c) && c > S.cfg.limC) bad.push(`Cont. ${c} Ω > ${S.cfg.limC} Ω`);
  if (!isNaN(t) && t > S.cfg.limT) bad.push(`Terra ${t} Ω > ${S.cfg.limT} Ω`);
  return bad;
}

function rowDiagnosis(r) {
  const j = judge(r);
  const visBad = [];
  if (r.barra === "NC") visBad.push("Barra/Fixação NC");
  if (r.eld === "NC") visBad.push("Eletroduto/Placa NC");
  if (r.cx === "NC") visBad.push("Caixa/Bimetálico NC");
  const allBad = [...visBad, ...j];
  if (allBad.length) {
    return {ok: false, measured: true, short: "REPROVADO (NC)", detail: allBad.join(" | ")};
  }
  if (r.cont !== "" || r.terra !== "" || [r.barra, r.eld, r.cx].includes("OK")) {
    return {ok: true, measured: true, short: "APROVADO (OK)", detail: "Dentro dos parâmetros da NBR 5419"};
  }
  return {ok: true, measured: false, short: "NÃO MEDIDO", detail: "Sem leitura registrada"};
}

// Consolida NCs manuais + NCs automáticas detectadas nas linhas de medição
function collectAllBlockNCs(b) {
  const f = F(b[0]);
  const list = [];
  (f.ncs || []).forEach((n, idx) => {
    const info = COD[n.cod] || ["Desvio técnico identificado em campo", n.sev || "B", "Realizar adequação conforme NBR 5419:2015."];
    list.push({
      code: `NC-${String(list.length + 1).padStart(2, "0")}`,
      ponto: n.ponto || "Geral",
      codRef: n.cod || "—",
      titulo: info[0],
      sev: n.sev || info[1] || "B",
      detalhe: n.det || info[2],
      ph: n.ph || []
    });
  });

  // Adiciona automaticamente desvios marcados nas descidas que ainda não estejam na lista manual
  (f.rows || []).forEach(r => {
    const c = num(r.cont), t = num(r.terra);
    const issues = [];
    let sev = "B";
    const recs = [];
    if (!isNaN(c) && c > S.cfg.limC) {
      issues.push(`Continuidade medida = ${r.cont} Ω (limite ≤ ${S.cfg.limC} Ω)`);
      sev = "A";
      recs.push(COD.C1[2]);
    }
    if (!isNaN(t) && t > S.cfg.limT) {
      issues.push(`Resistência de terra = ${r.terra} Ω (limite ≤ ${S.cfg.limT} Ω)`);
      sev = "A";
      recs.push(COD.C10[2]);
    }
    if (r.barra === "NC") {
      issues.push("Barra chata / fixação com anomalia (NC)");
      recs.push(COD.C7[2]);
    }
    if (r.eld === "NC") {
      issues.push("Eletroduto PVC / placa de advertência ausente ou danificado (NC)");
      recs.push(COD.C6[2]);
    }
    if (r.cx === "NC") {
      issues.push("Caixa de inspeção / conector bimetálico com anomalia (NC)");
      recs.push(COD.C4[2]);
    }
    if (issues.length) {
      const pontoName = r.loc ? `${r.p} (${r.loc})` : r.p;
      list.push({
        code: `NC-${String(list.length + 1).padStart(2, "0")}`,
        ponto: pontoName,
        codRef: !isNaN(c) && c > S.cfg.limC ? "C1/C10" : "Visual",
        titulo: issues.join("; "),
        sev,
        detalhe: recs.join(" "),
        ph: r.ph || []
      });
    }
  });

  return list;
}

function blockStats(b) {
  const f = F(b[0]);
  const o = b[3] || "";
  const isOnly = o.includes("only");
  const totR = f.rows.length;
  const medR = f.rows.filter(r => r.cont !== "" || r.terra !== "" || r.barra || r.eld || r.cx).length;
  const ncsRows = f.rows.filter(r => judge(r).length || [r.barra, r.eld, r.cx].includes("NC")).length;
  const totNC = f.ncs.length + ncsRows;
  const totPh = (f.bepPh || []).length + f.rows.reduce((a, r) => a + (r.ph || []).length, 0) + f.ncs.reduce((a, n) => a + (n.ph || []).length, 0);
  const chkCount = Object.values(f.chk || {}).filter(Boolean).length;

  const isCompleted = !!(f.done && f.done.vis && f.done.med && f.done.foto && f.done.pl) ||
    (isOnly ? (f.bepOk && (f.bepC || f.bepT) && totPh > 0) : (totR > 0 && medR === totR && chkCount >= 3 && totPh > 0));
  const isStarted = !!(medR > 0 || chkCount > 0 || totPh > 0 || f.bepOk || f.bepC || f.bepT || f.hi || f.done.vis || f.done.med);

  let status = "PENDENTE";
  if (totNC > 0 && !f.done.pl) status = "NC";
  else if (isCompleted) status = "CONCLUIDO";
  else if (isStarted) status = "ANDAMENTO";

  const missing = [];
  if (!isOnly && chkCount < CHK.length && !f.done.vis) missing.push(`Checklist (${chkCount}/${CHK.length})`);
  if (!isOnly && medR < totR && !f.done.med) missing.push(`Medições (${medR}/${totR})`);
  if ((o.includes("bep") || isOnly) && !f.bepC && !f.bepT) missing.push("Medir BEP");
  if (totPh === 0 && !f.done.foto) missing.push("Fotos HD");
  if (!f.done.pl) missing.push("Planta A3");

  return {f, totR, medR, totNC, totPh, chkCount, isCompleted, isStarted, status, missing};
}

async function delPhoto(id, kind, idx, pi, name) {
  if (!confirm("Excluir esta foto?")) return;
  const f = F(id);

/* ============================================================================
   CAPTURA DE FOTO EM HD + CARIMBO BEM VISÍVEL (ESTILO DA FOTO DE REFERÊNCIA)
   ============================================================================ */
function formatStampDate(d) {
  const meses = ["jan.", "fev.", "mar.", "abr.", "mai.", "jun.", "jul.", "ago.", "set.", "out.", "nov.", "dez."];
  const dia = d.getDate();
  const mes = meses[d.getMonth()];
  const ano = d.getFullYear();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const ss = String(d.getSeconds()).padStart(2, "0");
  return `${dia} de ${mes} de ${ano} ${hh}:${mm}:${ss}`;
}

function roundRectCanvas(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function processPhotoHDWithStamp(file, stampLine1, stampLine2, stampLine3 = "") {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const maxDim = Number(S.cfg.resFoto) || 2560;
      const scale = maxDim > 0 ? Math.min(1, maxDim / Math.max(img.width, img.height)) : 1;
      const W = Math.round(img.width * scale);
      const H = Math.round(img.height * scale);

      const c = document.createElement("canvas");
      c.width = W;
      c.height = H;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, W, H);

      if (S.cfg.carimboOn !== 0) {
        const refSide = Math.min(W, H);
        const marginX = Math.round(refSide * 0.035);
        const marginY = Math.round(refSide * 0.035);
        // Fonte maior para ficar 100% legível mesmo dentro do documento Word/PDF
        const fontTitle = Math.max(24, Math.round(refSide * 0.048));
        const fontSub = Math.max(20, Math.round(refSide * 0.038));
        const padX = Math.round(fontTitle * 0.72);
        const padY = Math.round(fontTitle * 0.62);
        const lineGap = Math.round(fontTitle * 0.34);

        ctx.font = `700 ${fontTitle}px system-ui, -apple-system, Roboto, Arial, sans-serif`;
        const w1 = ctx.measureText(stampLine1).width;
        ctx.font = `400 ${fontSub}px system-ui, -apple-system, Roboto, Arial, sans-serif`;
        const w2 = ctx.measureText(stampLine2).width;
        const w3 = stampLine3 ? ctx.measureText(stampLine3).width : 0;

        const minBoxW = Math.round(W * 0.72);
        const maxBoxW = W - marginX * 2;
        const boxW = Math.min(maxBoxW, Math.max(minBoxW, Math.max(w1, w2, w3) + padX * 2));
        const extraH = stampLine3 ? (fontSub + lineGap) : 0;
        const boxH = padY * 2 + fontTitle + lineGap + fontSub + extraH;
        const radius = Math.round(fontTitle * 0.52);

        ctx.save();
        roundRectCanvas(ctx, marginX, marginY, boxW, boxH, radius);
        ctx.fillStyle = "rgba(22, 26, 30, 0.78)";
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.textBaseline = "top";
        ctx.font = `700 ${fontTitle}px system-ui, -apple-system, Roboto, Arial, sans-serif`;
        ctx.fillText(stampLine1, marginX + padX, marginY + padY);

        ctx.font = `400 ${fontSub}px system-ui, -apple-system, Roboto, Arial, sans-serif`;
        ctx.fillText(stampLine2, marginX + padX, marginY + padY + fontTitle + lineGap);

        if (stampLine3) {
          ctx.fillStyle = "#fde047";
          ctx.font = `600 ${fontSub}px system-ui, -apple-system, Roboto, Arial, sans-serif`;
          ctx.fillText(stampLine3, marginX + padX, marginY + padY + fontTitle + lineGap * 2 + fontSub);
        }
        ctx.restore();
      }

      c.toBlob(blob => res(blob), "image/jpeg", 0.92);
    };
    img.src = URL.createObjectURL(file);
  });
}

function photo(id, ponto, ri, ni, useCam = true) {
  const b = getB().find(x => x[0] == id) || [id, id, 1, ""];
  const f = F(id);
  let subLabel = ponto;
  let extraMeasure = "";
  if (ri >= 0 && ri != null && f.rows[ri]) {
    const r = f.rows[ri];
    if (r.loc) subLabel = `${r.p} (${r.loc})`;
    const parts = [];
    if (r.cont !== "") parts.push(`Cont: ${r.cont} Ω`);
    if (r.terra !== "") parts.push(`Terra: ${r.terra} Ω`);
    if (parts.length) extraMeasure = parts.join("  |  ");
  }

  const i = document.createElement("input");
  i.type = "file";
  i.accept = "image/*";
  if (useCam) i.capture = "environment";
  else i.multiple = true;

  i.onchange = async () => {
    if (!i.files || !i.files.length) return;
    const st = $("#st-msg");
    if (st) st.textContent = "Processando foto HD com carimbo…";

    for (const file of i.files) {
      const d = new Date();
      const stampLine1 = `${b[1]}--${subLabel}`;
      const stampLine2 = formatStampDate(d);
      const bl = await processPhotoHDWithStamp(file, stampLine1, stampLine2, extraMeasure);

      const hh = d.toTimeString().slice(0, 8).replace(/:/g, "");
      const cleanPonto = String(ponto).replace(/[^a-zA-Z0-9_-]/g, "");
      const name = `${id}_${cleanPonto}_${d.toISOString().slice(0, 10)}_${hh}_${Math.random().toString(36).slice(2, 5)}.jpg`;

      await pset(name, {
        b: bl,
        id,
        ponto,
        stampTitle: stampLine1,
        stampDate: stampLine2,
        t: d.toISOString(),
        s: 0
      });

      if (ri >= 0 && ri != null && ri !== undefined) f.rows[ri].ph.push(name);
      else if (ni != null && ni >= 0) (f.ncs[ni].ph ??= []).push(name);
      else (f.bepPh ??= []).push(name);
    }
    if (st) st.textContent = "";
    save();
    render();
  };
  i.click();
}

/* ============================================================================
   GERADOR NATIVO DE DOCUMENTO MICROSOFT WORD (.DOCX - OPENXML ZIP)
   Gera um arquivo .docx real com tabelas formatadas, fotos em alta nitidez,
   parecer técnico e quadro de Carimbo da RT / Assinatura pronto para o Word!
   ============================================================================ */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) {
    c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  }
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function buildZipBlob(files) {
  const enc = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  for (const f of files) {
    const nameBytes = enc.encode(f.name);
    const data = f.data instanceof Uint8Array ? f.data : enc.encode(String(f.data));
    const crc = crc32(data);
    const len = data.length;

    const lhdr = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(lhdr.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true); // UTF-8 filename flag
    lv.setUint16(8, 0, true);      // STORE (no compression)
    lv.setUint16(10, 0, true);
    lv.setUint16(12, 0x4A21, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, len, true);
    lv.setUint32(22, len, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    lhdr.set(nameBytes, 30);

    localParts.push(lhdr, data);

    const chdr = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(chdr.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0x4A21, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, len, true);
    cv.setUint32(24, len, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    chdr.set(nameBytes, 46);

    centralParts.push(chdr);
    offset += lhdr.length + len;
  }

  const centralSize = centralParts.reduce((a, b) => a + b.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  return new Blob([...localParts, ...centralParts, eocd], {
    type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
  });
}

function xmlEsc(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function prepareImageForWord(blob) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      // Mantém excelente nitidez (até 1400px) para ler perfeitamente o carimbo no Word
      const k = Math.min(1, 1400 / Math.max(img.width, img.height));
      const w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      c.toBlob(b => {
        const fr = new FileReader();
        fr.onload = () => res({bytes: new Uint8Array(fr.result), w, h});
        fr.readAsArrayBuffer(b);
      }, "image/jpeg", 0.86);
    };
    img.onerror = () => res(null);
    img.src = URL.createObjectURL(blob);
  });
}

function wPara(text, opts = {}) {
  const align = opts.align ? `<w:jc w:val="${opts.align}"/>` : "";
  const spaceBefore = opts.before ?? 60;
  const spaceAfter = opts.after ?? 80;
  const shading = opts.bg ? `<w:shd w:val="clear" w:color="auto" w:fill="${opts.bg}"/>` : "";
  const bold = opts.bold ? "<w:b/>" : "";
  const italic = opts.italic ? "<w:i/>" : "";
  const color = opts.color ? `<w:color w:val="${opts.color}"/>` : "";
  const sz = opts.size || 20; // 20 half-points = 10pt
  return `<w:p>
    <w:pPr><w:spacing w:before="${spaceBefore}" w:after="${spaceAfter}"/>${align}${shading}</w:pPr>
    <w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${bold}${italic}${color}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r>
  </w:p>`;
}

function wCell(contentXml, opts = {}) {
  const width = opts.w ? `<w:tcW w:w="${opts.w}" w:type="dxa"/>` : "";
  const span = opts.span ? `<w:gridSpan w:val="${opts.span}"/>` : "";
  const bg = opts.bg ? `<w:shd w:val="clear" w:color="auto" w:fill="${opts.bg}"/>` : "";
  const vAlign = `<w:vAlign w:val="${opts.vAlign || "center"}"/>`;
  return `<w:tc><w:tcPr>${width}${span}${bg}${vAlign}</w:tcPr>${contentXml}</w:tc>`;
}

function wCellText(text, opts = {}) {

</Relationships>`;

  const docRelsItems = [
    `<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`,
    ...mediaFiles.map(m => `<Relationship Id="${m.rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.fileName}"/>`)
  ].join("\n  ");

  const docRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  ${docRelsItems}
</Relationships>`;

  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults>
    <w:rPrDefault>
      <w:rPr>
        <w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>
        <w:sz w:val="20"/>
        <w:szCs w:val="20"/>
        <w:lang w:val="pt-BR"/>
      </w:rPr>
    </w:rPrDefault>
  </w:docDefaults>
</w:styles>`;

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
            xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
            xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">
  <w:body>
    ${bodyParts.join("\n")}
    <w:sectPr>
      <w:pgSz w:w="11906" w:h="16838"/>
      <w:pgMar w:top="850" w:right="850" w:bottom="850" w:left="850" w:header="450" w:footer="450" w:gutter="0"/>
    </w:sectPr>
  </w:body>
</w:document>`;

  const zipEntries = [
    {name: "[Content_Types].xml", data: contentTypesXml},
    {name: "_rels/.rels", data: rootRelsXml},
    {name: "word/_rels/document.xml.rels", data: docRelsXml},
    {name: "word/styles.xml", data: stylesXml},
    {name: "word/document.xml", data: documentXml},
    ...mediaFiles.map(m => ({name: `word/media/${m.fileName}`, data: m.bytes}))
  ];

  const docxBlob = buildZipBlob(zipEntries);
  if (st) st.textContent = "";
  const eqPrefix = teamFilter == 1 ? "EquipeA_" : (teamFilter == 2 ? "EquipeB_" : "");
  const fname = `${eqPrefix}Laudo_SPDA_${(c.cliente || "Campo").replace(/[^a-zA-Z0-9_-]/g, "_")}_${(c.data || new Date().toISOString().slice(0, 10))}.docx`;
  return new File([docxBlob], fname, {
    type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
  });
}

async function downloadWord(teamFilter = 0) {
  const file = await buildWordDocxFile(teamFilter);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  a.click();
}

async function shareWord(teamFilter = 0) {
  const file = await buildWordDocxFile(teamFilter);
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try {
      await navigator.share({
        files: [file],
        title: "Laudo SPDA (Word) — " + (S.cfg.cliente || "Campo"),
        text: "Segue o Laudo Técnico de Inspeção de SPDA em Word (.docx) pronto para anexar o carimbo da RT."
      });
      return;
    } catch (e) {
      if (e.name === "AbortError") return;
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  a.click();
}

function saveBlockModal(editId) {
  const B = getB();
  let id = ($("#mb-id").value || "").trim().replace(/[^a-zA-Z0-9_-]/g, "");
  const nome = ($("#mb-nome").value || "").trim();
  const dupla = parseInt($("#mb-dupla").value) || 1;
  const flags = [];
  if ($("#mb-bep").checked) flags.push("bep");
  if ($("#mb-dps").checked) flags.push("dps");
  if ($("#mb-only").checked) flags.push("only");
  const optStr = flags.join(" ");

  if (!nome) { alert("Informe o nome do local/bloco."); return; }
  if (!id) id = nome.slice(0, 4).toUpperCase().replace(/\s+/g, "") + Math.floor(Math.random() * 90 + 10);

  if (editId) {
    const idx = B.findIndex(x => x[0] === editId);
    if (idx >= 0) {
      B[idx] = [editId, nome, dupla, optStr];
      if (S.f[editId]) S.f[editId].dupla = dupla;
    }
  } else {
    if (B.some(x => x[0] === id)) {
      alert("Já existe um local com a sigla " + id + ".");
      return;
    }
    const qtd = Math.max(0, Math.min(60, parseInt($("#mb-qtd")?.value ?? 8)));
    B.push([id, nome, dupla, optStr]);
    const f = F(id);
    f.rows = optStr.includes("only") ? [] : Array.from({length: qtd}, (_, i) => R(i));
  }
  save();
  closeModal();
  render();
}

function deleteBlock(id) {
  if (!confirm("Remover este local da lista?")) return;
  S.blocos = getB().filter(x => x[0] !== id);
  delete S.f[id];
  save();
  closeModal();
  if (view === id) view = "";
  render();
}

function setNow(id, field) {
  const now = new Date().toTimeString().slice(0, 5);
  set(id, field, now, 1);
}

function snap() {
  return JSON.stringify({
    gerado: new Date().toISOString(),
    cfg: {...S.cfg, tok: undefined},
    blocos: getB(),
    lib: S.lib,
    f: S.f
  }, null, 2);
}

async function downloadAllPhotosHD() {
  const ks = await pkeys();
  if (!ks.length) { alert("Nenhuma foto salva no aparelho ainda."); return; }
  for (const k of ks) {
    const p = await pget(k);
    if (!p || !p.b) continue;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(p.b);
    a.download = k;
    a.click();
    await new Promise(r => setTimeout(r, 220));
  }
}

async function sendToTeamDrive(teamNum = 1) {
  const teamKey = teamNum == 2 ? "EquipeB" : "EquipeA";
  const folderUrl = getDriveUrl(teamNum);
  const wordFile = await buildWordDocxFile(teamNum);
  const jsonFile = new File([snap()], `${teamKey}_spda_dados.json`, {type: "application/json"});
  const files = [wordFile, jsonFile];
  const ks = await pkeys();
  const B = getB();
  for (const k of ks) {
    const p = await pget(k);
    if (!p || !p.b) continue;
    const blk = B.find(x => x[0] === p.id);
    if (blk && blk[2] != teamNum) continue;
    files.push(new File([p.b], k, {type: "image/jpeg"}));
  }

  if (navigator.canShare && navigator.canShare({files})) {
    try {
      await navigator.share({
        files,
        title: `Laudo Word SPDA ${teamLabel(teamNum)} — ${S.cfg.cliente || "Campo"}`,
        text: `Pasta Drive ${teamLabel(teamNum)}: ${folderUrl}`
      });
      for (const k of ks) {
        const p = await pget(k);
        const blk = B.find(x => x[0] === p.id);
        if (blk && blk[2] != teamNum) continue;
        p.s = 1;
        await pset(k, p);
      }
      render();
      return;
    } catch (e) {
      if (e.name === "AbortError") return;
    }
  }

  const a = document.createElement("a");
  a.href = URL.createObjectURL(wordFile);
  a.download = wordFile.name;
  a.click();
  setTimeout(() => window.open(folderUrl, "_blank"), 400);
}

function downloadJSONOnly() {
  const blob = new Blob([snap()], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `spda_dados_${(S.cfg.cliente || "campo").replace(/\s+/g, "_")}.json`;
  a.click();
}

function importJSONPrompt() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".json,application/json";
  inp.onchange = async () => {
    if (!inp.files || !inp.files[0]) return;
    try {
      const txt = await inp.files[0].text();
      const data = JSON.parse(txt);
      if (data.cfg) S.cfg = {...S.cfg, ...data.cfg};
      if (Array.isArray(data.blocos)) S.blocos = data.blocos;
      if (data.lib) S.lib = data.lib;
      if (data.f) S.f = data.f;
      await kset("S", S);
      alert("Dados importados com sucesso!");
      go("");
    } catch (e) {
      alert("Arquivo JSON inválido.");
    }
  };
  inp.click();
}

function resetDefaultBlocks() {
  if (!confirm("Restaurar a lista de blocos padrão (Bloco A até BEP Reservatório)?")) return;
  S.blocos = DEFAULT_B.map(x => [...x]);
  save();
  render();
}

async function clearAllData() {
  if (!confirm("ATENÇÃO: Isso apagará todas as medições e fotos salvas neste aparelho. Confirmar?")) return;
  S.f = {};
  S.lib = {};
  const ks = await pkeys();
  for (const k of ks) await pdel(k);
  photoURLCache = {};
  await kset("S", S);
  go("");
}

async function printReport(teamFilter = 0) {
  const allB = getB(), c = S.cfg;
  const B = teamFilter ? allB.filter(b => b[2] == teamFilter) : allB;
  let html = `
    <div style="background:#1F3A5F;color:#fff;padding:12px 16px;margin-bottom:14px">
      <div style="font-size:12px;opacity:.9">${esc(c.empresa || "TH ELÉTRICA — ENGENHARIA E LAUDOS TÉCNICOS")}</div>
      <h2 style="margin:4px 0">LAUDO TÉCNICO DE INSPEÇÃO E MEDIÇÃO DE SPDA — ABNT NBR 5419:2015</h2>
      <div style="font-size:12px">
        <b>Cliente:</b> ${esc(c.cliente || "Amigos do Bem")} (${esc(c.local || "")}) |
        <b>Data:</b> ${esc(c.data)} |
        <b>Limites:</b> Cont. ≤ ${c.limC} Ω / Terra ≤ ${c.limT} Ω
      </div>
    </div>`;

  for (const b of B) {
    const bs = blockStats(b);
    const f = bs.f;
    if (c.soPreenchidos && !bs.isStarted && !bs.totNC) continue;

    const blockNCs = collectAllBlockNCs(b);
    const photos = [];
    for (const k of (f.bepPh || [])) photos.push({k, cap: `${b[1]} — BEP`});
    for (const r of (f.rows || [])) for (const k of (r.ph || [])) photos.push({k, cap: `${b[1]} — ${r.p}${r.loc ? ` (${r.loc})` : ""}`});
    for (let i = 0; i < (f.ncs || []).length; i++) for (const k of (f.ncs[i].ph || [])) photos.push({k, cap: `${b[1]} — NC-${i + 1}`});

    const rowsToRender = c.soPreenchidos
      ? f.rows.filter(r => r.cont !== "" || r.terra !== "" || r.barra || r.eld || r.cx || (r.ph && r.ph.length))
      : f.rows;

    html += `
      <div class="p-card">
        <h3 style="margin:0 0 6px;color:#1F3A5F">${esc(b[1])} [${esc(b[0])}] — ${teamLabel(b[2])}</h3>
        <div><b>Horário:</b> ${esc(f.hi || "-")} às ${esc(f.hf || "-")} | <b>Solo:</b> ${esc(f.solo || "-")}</div>
        ${rowsToRender.length ? `
          <table class="p-tbl">
            <thead><tr><th>Ponto / Ref.</th><th>Barra</th><th>Eletrod.</th><th>Caixa</th><th>Cont. (Ω)</th><th>Terra (Ω)</th><th>Planta</th><th>Diagnóstico</th></tr></thead>
            <tbody>
              ${rowsToRender.map(r => {
                const diag = rowDiagnosis(r);
                return `<tr>
                  <td><b>${esc(r.p)}</b> ${r.loc ? `(${esc(r.loc)})` : ""}</td>
                  <td>${esc(r.barra || "-")}</td>
                  <td>${esc(r.eld || "-")}</td>
                  <td>${esc(r.cx || "-")}</td>
                  <td>${esc(r.cont || "-")}</td>
                  <td>${esc(r.terra || "-")}</td>
                  <td>${esc(r.pl || "-")}</td>
                  <td style="font-weight:bold;color:${diag.ok ? "#15803D" : "#B91C1C"}">${esc(diag.ok ? diag.short : `${diag.short}: ${diag.detail}`)}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>` : ""}
        ${blockNCs.length ? `
          <div style="margin-top:8px"><b>Não Conformidades e Recomendações de Reparo:</b>
            <table class="p-tbl">
              <thead><tr><th>Item</th><th>Ponto</th><th>Sev.</th><th>Desvio</th><th>Recomendação Técnica</th></tr></thead>
              <tbody>
                ${blockNCs.map(n => `<tr><td><b>${esc(n.code)}</b></td><td>${esc(n.ponto)}</td><td><b>${esc(n.sev)}</b></td><td>${esc(n.titulo)}</td><td>${esc(n.detalhe)}</td></tr>`).join("")}
              </tbody>
            </table>
          </div>` : ""}
        ${photos.length ? `
          <div class="p-grid-ph">
            ${photos.map(p => `<div class="p-ph"><img data-ph="${esc(p.k)}"><div style="font-size:11px;font-weight:600;margin-top:4px">${esc(p.cap)}</div></div>`).join("")}
          </div>` : ""}
      </div>`;
  }

  html += `
    <div class="p-card" style="text-align:center;padding:24px;margin-top:18px">
      <div style="font-weight:bold;color:#475569;margin-bottom:70px">ESPAÇO PARA CARIMBO DO RESPONSÁVEL TÉCNICO / SELO DA ART</div>
      <div>________________________________________________________</div>
      <div style="font-weight:bold;margin-top:4px">Responsável Técnico: ${esc(c.resp || "____________________________________")}</div>
      <div>CREA / CFT: ${esc(c.crea || "____________________")} | ART: ${esc(c.art || "____________________")}</div>
    </div>`;

  $("#print-area").innerHTML = html;
  await hydrateThumbs();
  setTimeout(() => window.print(), 250);
}
